[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-dfe"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.0",
    "cryptography>=50.0.0",
    "signxml>=4.4.0",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["py_dfe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that exercise the full HTTP pipeline with mocked responses",
]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["py_dfe"]
omit = ["tests/*"]
