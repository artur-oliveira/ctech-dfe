{% import "_damdfe_macros.html" as m %}
<style>
  @page {
    size: A4 landscape;
    margin: 9mm 5mm 16mm 5mm;
    @top-right { content: "FOLHA " counter(page) "/" counter(pages); font-size: 6pt; color: #555; vertical-align: top; }
    @bottom-center { content: element(footzone); vertical-align: top; width: 100%; }
  }
  body { font-family: "Times New Roman", serif; font-size: 8pt; color: #000; margin: 0; }
  .footzone { position: running(footzone); width: 100%; }
  .foot-line { font-size: 6pt; color: #555; text-align: left; margin-top: 1pt; }
  .b { font-weight: bold; } .center { text-align: center; }
  .tiny { font-size: 5.5pt; } .small { font-size: 7pt; }
  .big { font-size: 12pt; } .xbig { font-size: 15pt; }
  table { width: 100%; border-collapse: collapse; table-layout: auto; }
  .docs { table-layout: fixed; }
  .rowtop { border-top: 0.3pt solid #bbb; }

  .quadro { border: 0.6pt solid #000; border-radius: 5px; overflow: hidden; margin-bottom: 3pt; }
  .quadro-title { font-size: 6pt; font-weight: bold; margin: 2pt 0 1pt 2pt; }
  .grid td { border-top: 0.3pt solid #bbb; border-left: 0.3pt solid #bbb;
    padding: 1.5pt 3pt; vertical-align: top; word-wrap: break-word; }
  .grid tr td:first-child { border-left: none; }
  .grid tr:first-child td { border-top: none; }

  .fld .lbl { font-size: 5.5pt; font-weight: bold; color: #444; display: block; line-height: 1.1; }
  .fld .val { font-weight: bold; display: block; min-height: 8pt; }
  .num { text-align: right; } .num .val { text-align: right; white-space: nowrap; }
  .chave { letter-spacing: 0.2pt; font-size: 6.5pt; }
  .banner-cell .val { text-align: center; font-weight: bold; font-size: 10pt; }

  .w10{width:10%}.w14{width:14%}.w15{width:15%}.w20{width:20%}.w22{width:22%}
  .w24{width:24%}.w25{width:25%}.w30{width:30%}.w34{width:34%}.w40{width:40%}
  .w50{width:50%}.w70{width:70%}.w100{width:100%}

  .hdr .emit { width: 50%; } .hdr .idbox { width: 22%; } .hdr .keybox { width: 28%; }
  .hdr td { vertical-align: top; }
  .barcode { width: 100%; height: 10mm; display: block; margin-bottom: 1pt; }
  .qr { width: 22mm; height: 22mm; display: block; margin: 2pt auto 0; }

  .watermark { position: fixed; top: 42%; left: 0; width: 100%; text-align: center;
    font-size: 46pt; color: rgba(0,0,0,0.10); transform: rotate(-20deg); font-weight: bold; }
</style>
{{ m.watermarks(ctx) }}
{{ m.header(ctx) }}
{{ m.ide_box(ctx) }}
{{ m.modal_box(ctx) }}
{{ m.carga_box(ctx) }}
{{ m.seg_box(ctx) }}
{{ m.docs_box(ctx) }}
<div class="footzone">
  {{ m.obs_box(ctx) }}
  <div class="foot-line">{{ ctx.text.gerado_por }} {{ ctx.site }} em {{ ctx.gerado_em }}</div>
</div>
