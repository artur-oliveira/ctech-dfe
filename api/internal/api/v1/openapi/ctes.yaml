paths:

  # ── CT-e ───────────────────────────────────────────────────────────────────
  # Spec: docs/specs/2026-11-05-cte-emissao-rodoviaria.md (CT-e 57, normal, rodoviário, a partir de NF-e).

  /v1.0/ctes/derive:
    post:
      tags: [ CT-e ]
      summary: Deriva o CT-e das notas
      description: |
        Lê cada NF-e do cadastro (emitidas e recebidas) e o XML autorizado, e devolve remetente,
        destinatário, tomador sugerido, carga, origem, destino e avisos. Não grava nada nem consome
        número fiscal. `Idempotency-Key` é opcional.

        Códigos de aviso: `mixed_sender`, `mixed_recipient`, `taker_ambiguous`, `weight_missing`,
        `note_not_authorized`, `note_not_found`, `note_wrong_model`, `note_xml_unavailable`.
        422 `note_not_found` quando nenhuma nota é encontrada.
      operationId: deriveCte
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CteDeriveBody' }
      responses:
        '200':
          description: Derivação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CteDerivation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/ctes/complement:
    post:
      tags: [ CT-e ]
      summary: Emite um CT-e complementar de valores (tpCTe 1)
      description: |
        Complementa de 1 a 10 CT-e autorizados da própria organização (mesmo ambiente). Participantes, percurso, tipo
        de serviço e tomador saem do XML autorizado de cada original no S3 (nunca do cadastro de pessoas); o corpo
        traz só o valor complementar (`freight`), o ICMS, o CFOP e o que for opcional. O XSD 4.00 não tem
        `vPresComp`: o valor complementar vai em `vPrest`/`Comp` e o imposto em `imp`. Resposta 202 com o registro
        `pending` (`cte_type` = `complement`, `complemented_keys`).

        422 com `code`: `original_not_found`, `original_not_issued_by_organization`, `original_not_authorized`,
        `original_xml_unavailable`, `original_xml_invalid`, `original_type_invalid` (só normal ou substituto),
        `original_unsupported` (só rodoviário), `original_too_old` (chave com mais de 12 meses, G161a),
        `originals_mismatch` (originais com participantes, percurso ou serviço diferentes, G168 a G176),
        `emitter_ie_changed` (G173), `contingency_not_allowed` (SVC não aceita complemento, G012), mais os da
        emissão normal: `cfop_required`, `icms_required`, `icms_rate_required`, `icms_sn_not_allowed`,
        `components_exceed_total`, `freight_total_invalid`, `autxml_invalid`, `cte_config_required`. As regras que
        dependem do estado na SEFAZ (G162 a G167, limite de 10 complementos por original) são da SEFAZ.
      operationId: complementCte
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CteComplementBody' }
      responses:
        '202':
          description: CT-e complementar registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CteDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/ctes/substitute:
    post:
      tags: [ CT-e ]
      summary: Emite um CT-e substituto (tpCTe 3)
      description: |
        Substitui um CT-e autorizado da própria organização. Participantes, percurso, tipo de serviço, carga e as
        NF-e saem do XML autorizado do original no S3 (G086 a G095); o corpo traz o valor, os tributos e, com
        `change_taker`, o novo tomador (`indAlteraToma`, G097 a G101). Sem `change_taker` o tomador é o do original.
        Só emissão normal (G076). Resposta 202 com o registro `pending` (`cte_type` = `substitute`, `substituted_key`).

        422 com `code`: os de `original_*` e `emitter_ie_changed` do complemento (exceto `originals_mismatch`),
        `substitution_window_expired` (emitido há mais de 60 dias mais 168 h; entre 60 e 67 dias a SEFAZ decide, G096),
        `contingency_not_allowed`, `rntrc_required`, `taker_change_not_requested` (`taker` sem `change_taker`),
        `taker_required`, `taker_role_missing`, `taker_unchanged` (G101), `taker_base_not_in_original` (G099),
        `taker_uf_mismatch` (G100), `taker_person_required`, `person_not_found`, mais os da emissão normal.
        Ficam com a SEFAZ: existência e situação do original (G079 a G083), o evento de prestação em desacordo do
        tomador no original (G084, 739) e o prazo exato de 60 dias da autorização (G096).
      operationId: substituteCte
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CteSubstituteBody' }
      responses:
        '202':
          description: CT-e substituto registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CteDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/ctes/os:
    post:
      tags: [ CT-e ]
      summary: Emite um CT-e OS (modelo 67, rodoviário)
      description: |
        CT-e OS de transporte de pessoas (`people`, tpServ 6), de valores (`values`, 7) ou excesso de bagagem
        (`baggage`, 8), tpCTe 0. Serviço `CTeRecepcaoOS`; chave com modelo 67; numeração e série compartilhadas com o
        CT-e 57 do mesmo ambiente (mesmo contador da Configuração Fiscal do CT-e). Sem notas: o corpo traz o serviço,
        o tomador (pessoa do cadastro, sempre), o percurso e os dados do tipo. Resposta 202 com o registro `pending`
        (`model` = `67`, `os_service`). CFOP, ICMS e tomador nunca são presumidos. Não há catálogo de regras H do MOC no
        portão: valem o esquema `cteOS_v4.00.xsd` (tamanhos) e as validações abaixo.

        422 com `code`: `os_emitter_cnpj_required`, `os_place_required` (H019, H020, H020a), `os_place_uf_mismatch`,
        `os_road_required` (H015), `os_road_not_allowed` (H018, valores), `os_state_registration_required` (H023),
        `os_taf_required` (H024), `os_charter_required` (H025), `os_trip_at_required` (H026), `os_trip_at_past` (H027),
        `os_doc_refs_required` (H028), `os_doc_refs_not_allowed`, `os_bpe_key_invalid` (H029, H029a),
        `os_gtve_required` (H045a), `os_gtve_not_allowed` (H045), `os_gtve_invalid` (H046a, H051, H052),
        `os_gtve_total_mismatch` (H053, tolerância 0,10), `os_inss_required` (H057), `os_icms_cst_not_allowed` (o CT-e
        OS não tem ICMS60), `person_not_found` e os de valor/tributo da emissão normal.
      operationId: emitCteOs
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CteOsEmitBody' }
      responses:
        '202':
          description: CT-e OS registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CteDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/ctes:
    post:
      tags: [ CT-e ]
      summary: Emite um CT-e rodoviário a partir de NF-e
      description: |
        O que o corpo não traz é recalculado no servidor pelas mesmas regras do `derive`. Resposta 202
        com o registro `pending`; o worker autoriza (`CTeRecepcaoSinc`) e o resultado chega pelo WebSocket.

        422 com `code`: `cfop_required`, `icms_required`, `icms_rate_required`, `icms_sn_not_allowed`,
        `rntrc_required`, `taker_person_required`, `person_not_found`, `weight_required`,
        `predominant_product_required`, `components_exceed_total`, `freight_total_invalid`,
        `city_unknown`, `mixed_sender`, `mixed_recipient`, `note_not_found`, `note_not_authorized`,
        `cte_config_required`.
      operationId: emitCte
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CteEmitBody' }
      responses:
        '202':
          description: CT-e registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CteDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [ CT-e ]
      summary: Lista CT-e
      operationId: listCtes
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - name: incoming
          in: query
          description: '`1` lista os CT-e recebidos (distribuição); `0` os emitidos.'
          schema: { type: integer, enum: [ 0, 1 ] }
        - $ref: '#/components/parameters/FilterNumber'
        - $ref: '#/components/parameters/FilterYear'
        - $ref: '#/components/parameters/FilterMonth'
        - $ref: '#/components/parameters/FilterDay'
      responses:
        '200':
          description: Página de CT-e
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/CteDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1.0/ctes/{access_key}/sefaz-status:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    get:
      tags: [ CT-e ]
      summary: Situação do CT-e na SEFAZ
      description: |
        Consulta síncrona `CTeConsulta` pelo go-dfe-egress: situação atual, protocolo de autorização e
        eventos registrados. Só lê; o registro local não muda. cStat 100, 101 e 217 são resposta
        (`status` authorized, cancelled, not_found); outro cStat (chave inválida, muito antiga, diferente
        da base) é 400 `sefaz-rejection` com `cstat`. CT-e de outra organização é 404.
      operationId: getCteSefazStatus
      responses:
        '200':
          description: Situação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CteSituation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1.0/ctes/{access_key}:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    get:
      tags: [ CT-e ]
      summary: Detalha um CT-e
      operationId: getCte
      responses:
        '200':
          description: CT-e
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CteDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1.0/ctes/{access_key}/dacte:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    get:
      tags: [ CT-e ]
      summary: Baixa o DACTE em PDF
      description: A4 retrato. CT-e offline ainda não autorizado sai da cópia assinada guardada, com a legenda de contingência.
      operationId: getCteDacte
      responses:
        '200': { $ref: '#/components/responses/CachedPdfDownload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1.0/ctes/{access_key}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ CT-e ]
      summary: Cancela um CT-e (evento 110111)
      description: |
        Só CT-e autorizado do próprio emitente (422 `not_cte_issuer`, `cte_not_authorized`,
        `cte_protocol_missing`). O CT-e vai a `cancel_pending` até a SEFAZ responder; o nSeqEvento é sempre 1.
        Prazo, circulação, MDF-e, CC-e e CT-e de substituição ou complemento associados são conferidos pela
        SEFAZ (rejeições 218, 219, 220, 523, 528, 574, 576, 660, 862). Duplicidade (631) e CT-e já cancelado
        (218) confirmam o cancelamento.
      operationId: cancelCte
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CteCancelBody' }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CteDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/ctes/{access_key}/correction-letter:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ CT-e ]
      summary: Carta de correção do CT-e (evento 110110)
      description: |
        Só CT-e autorizado do próprio emitente. `sequence_number` omitido vira o seguinte ao maior já enviado
        (1 a 20). Quais campos podem ser corrigidos é conferido pela SEFAZ (rejeição 681); o CT-e continua autorizado.
      operationId: correctCte
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CteCorrectionBody' }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CteDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/ctes/{access_key}/service-disagreement:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ CT-e ]
      summary: Prestação de serviço em desacordo (evento 610110)
      description: |
        Evento do tomador do serviço (422 `not_cte_taker`). Até 45 dias da autorização (rejeição 787 da SEFAZ).
        `sequence_number` omitido vira o seguinte ao maior já enviado (1 a 20).
      operationId: disagreeCteService
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CteDisagreementBody' }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CteDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/ctes/{access_key}/service-disagreement-cancel:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ CT-e ]
      summary: Cancela a prestação em desacordo (evento 610111)
      description: |
        Evento do tomador. O evento 610110 a cancelar é escolhido por `event_sk` na lista de eventos (precisa estar
        com status `success`; 422 `event_not_authorized`); o protocolo vem do registro dele.
      operationId: cancelCteServiceDisagreement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CteDisagreementCancelBody' }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CteDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/ctes/{access_key}/delivery-receipt:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ CT-e ]
      summary: Comprovante de entrega do CT-e (evento 110180)
      description: |
        Evento do emitente, CT-e autorizado. `nfe_keys` só para serviço Normal (`infEntrega`). Retorno 135.
      operationId: registerCteDeliveryReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ occurred_at, hash_at, hash, doc_number, name ]
              properties:
                occurred_at: { type: string, format: date-time }
                hash_at: { type: string, format: date-time }
                hash: { type: string, minLength: 28, maxLength: 28, description: SHA-1 em Base64 }
                latitude: { type: string }
                longitude: { type: string }
                nfe_keys: { type: array, maxItems: 2000, items: { type: string, minLength: 44, maxLength: 44 } }
                sequence_number: { type: integer, minimum: 1, maximum: 20 }
                doc_number: { type: string, minLength: 2, maxLength: 20 }
                name: { type: string, minLength: 2, maxLength: 60 }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CteDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/ctes/{access_key}/delivery-failure:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ CT-e ]
      summary: Insucesso na entrega do CT-e (evento 110190)
      description: |
        Evento do emitente. `reason_type` 1 a 4; `justification` (25 a 250) só e obrigatória no 4.
      operationId: registerCteDeliveryFailure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ occurred_at, hash_at, hash, reason_type ]
              properties:
                occurred_at: { type: string, format: date-time }
                hash_at: { type: string, format: date-time }
                hash: { type: string, minLength: 28, maxLength: 28, description: SHA-1 em Base64 }
                latitude: { type: string }
                longitude: { type: string }
                nfe_keys: { type: array, maxItems: 2000, items: { type: string, minLength: 44, maxLength: 44 } }
                sequence_number: { type: integer, minimum: 1, maximum: 20 }
                attempt: { type: integer, minimum: 1, maximum: 999 }
                reason_type: { type: integer, enum: [ 1, 2, 3, 4 ] }
                justification: { type: string, minLength: 25, maxLength: 250 }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CteDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/ctes/{access_key}/delivery-cancel:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ CT-e ]
      summary: Cancela o comprovante de entrega (110181) ou o insucesso (110191)
      description: |
        `kind` `receipt` ou `failure`; o evento a cancelar é escolhido por `event_sk` (precisa estar `success`); o protocolo vem do registro.
      operationId: cancelCteDeliveryEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ kind, event_sk ]
              properties:
                kind: { type: string, enum: [ receipt, failure ] }
                event_sk: { type: string }
                sequence_number: { type: integer, minimum: 1, maximum: 20 }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CteDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/ctes/{access_key}/events:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    get:
      tags: [ CT-e ]
      summary: Lista os eventos de um CT-e
      operationId: listCteEvents
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de eventos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/DocumentEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1.0/ctes/{access_key}/events/{event_sk}/xml:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
      - $ref: '#/components/parameters/EventSk'
    get:
      tags: [ CT-e ]
      summary: Baixa o XML de um evento
      operationId: getCteEventXml
      responses:
        '200': { $ref: '#/components/responses/XmlDownload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  schemas:

    CteCancelBody:
      type: object
      required: [ justification ]
      properties:
        justification: { type: string, minLength: 15, maxLength: 255 }

    CteCorrection:
      type: object
      required: [ group, field, value ]
      properties:
        group: { type: string, minLength: 1, maxLength: 20, description: grupoAlterado, exemplo ide }
        field: { type: string, minLength: 1, maxLength: 20, description: campoAlterado }
        value: { type: string, minLength: 1, maxLength: 500, description: valorAlterado }
        item_number: { type: integer, minimum: 1, maximum: 99, description: nroItemAlterado, quando a alteração é numa lista }

    CteCorrectionBody:
      type: object
      required: [ corrections ]
      properties:
        corrections:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/CteCorrection' }
        sequence_number: { type: integer, minimum: 1, maximum: 20 }

    CteDisagreementBody:
      type: object
      required: [ notes ]
      properties:
        notes: { type: string, minLength: 15, maxLength: 255, description: xObs, obrigatório }
        sequence_number: { type: integer, minimum: 1, maximum: 20 }

    CteDisagreementCancelBody:
      type: object
      required: [ event_sk ]
      properties:
        event_sk: { type: string, description: sk do evento 610110 na lista de eventos }
        sequence_number: { type: integer, minimum: 1, maximum: 20 }

    CteSituation:
      type: object
      required: [ access_key, c_stat, x_motivo, status, events ]
      properties:
        access_key: { $ref: '#/components/schemas/AccessKey' }
        c_stat: { type: string }
        x_motivo: { type: string }
        status: { type: string, enum: [ authorized, cancelled, not_found ] }
        protocol:
          type: [ object, 'null' ]
          properties:
            n_prot: { type: string }
            dh_recbto: { type: string }
            c_stat: { type: string }
            x_motivo: { type: string }
        events:
          type: array
          items:
            type: object
            properties:
              tp_evento: { type: string }
              n_seq_evento: { type: string }
              c_stat: { type: string }
              x_motivo: { type: string }
              n_prot: { type: string }
              dh_reg_evento: { type: string }

    CteNfeKeys:
      type: array
      minItems: 1
      maxItems: 50
      uniqueItems: true
      items: { $ref: '#/components/schemas/AccessKey' }
      description: Chaves de NF-e modelo 55.

    CteDeriveBody:
      type: object
      required: [ nfe_keys ]
      additionalProperties: false
      properties:
        nfe_keys: { $ref: '#/components/schemas/CteNfeKeys' }

    CteNoteParty:
      type: object
      properties:
        doc: { type: string }
        name: { type: string }
        uf: { type: string }
        city_ibge: { type: string }
        city: { type: string }

    CteParty:
      allOf:
        - $ref: '#/components/schemas/CteNoteParty'
        - type: object
          properties:
            person_id:
              type: [ string, 'null' ]
              description: SK da pessoa no cadastro (CNPJ_..., CPF_...) quando o documento existe lá.

    CtePlace:
      type: object
      properties:
        uf: { type: string }
        city_ibge: { type: string }
        city: { type: string }

    CteDerivation:
      type: object
      properties:
        notes:
          type: array
          items:
            type: object
            properties:
              access_key: { type: string }
              number: { type: integer }
              serie: { type: integer }
              issued_at: { type: string }
              source: { type: string, enum: [ issued, received ] }
              value: { type: string, description: 'vNF, 2 casas' }
              weight_kg: { type: [ string, 'null' ], description: '3 casas; null sem peso' }
              volumes: { type: integer }
              mod_frete: { type: string }
              emitter: { $ref: '#/components/schemas/CteNoteParty' }
              recipient: { $ref: '#/components/schemas/CteNoteParty' }
        sender:
          oneOf: [ { $ref: '#/components/schemas/CteParty' }, { type: 'null' } ]
        recipient:
          oneOf: [ { $ref: '#/components/schemas/CteParty' }, { type: 'null' } ]
        taker_suggestion:
          oneOf:
            - type: object
              properties:
                role: { type: string, enum: [ remetente, destinatario ] }
                reason: { type: string, enum: [ mod_frete_cif, mod_frete_fob ] }
            - type: 'null'
        cargo:
          type: object
          properties:
            total_value: { type: string }
            total_weight_kg: { type: [ string, 'null' ] }
            volumes: { type: integer }
            predominant_product: { type: string }
        origin:
          oneOf: [ { $ref: '#/components/schemas/CtePlace' }, { type: 'null' } ]
        destination:
          oneOf: [ { $ref: '#/components/schemas/CtePlace' }, { type: 'null' } ]
        warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              access_key: { type: [ string, 'null' ] }

    CteEmitBody:
      type: object
      required: [ nfe_keys, taker, freight ]
      additionalProperties: false
      properties:
        nfe_keys: { $ref: '#/components/schemas/CteNfeKeys' }
        taker:
          type: object
          required: [ role ]
          properties:
            role: { type: string, enum: [ remetente, destinatario, expedidor, recebedor, outro ] }
            person_id:
              type: [ string, 'null' ]
              description: Obrigatório para expedidor, recebedor e outro (pessoa do cadastro).
        freight:
          type: object
          required: [ total ]
          properties:
            total: { type: string, description: 'vTPrest, 2 casas' }
            components:
              type: array
              maxItems: 30
              items:
                type: object
                required: [ name, value ]
                properties:
                  name: { type: string, maxLength: 15 }
                  value: { type: string }
        ibs_cbs:
          type: [ object, 'null' ]
          description: |
            IBS/CBS (grupo `imp/IBSCBS`, regular). Nada é presumido: CST, classificação, base e alíquotas
            são do usuário; o servidor calcula os valores e o `vTotDFe` (vTPrest; soma IBS e CBS a partir de
            2027, regra IBSCBS-365). Só regime normal (CRT 3): outro CRT é 422 `ibscbs_regime_unsupported`.
            Diferimento, redução, tributação regular, compra governamental e Simples Nacional (gTribSN) não são suportados.
          required: [ cst, class_trib, base_value, ibs_uf_rate, ibs_mun_rate, cbs_rate ]
          properties:
            cst: { type: string, pattern: '^\d{3}$' }
            class_trib: { type: string, pattern: '^\d{6}$', description: cClassTrib }
            donation: { type: boolean, description: indDoacao }
            base_value: { type: string, description: 'vBC, 2 casas' }
            ibs_uf_rate: { type: string, description: 'pIBSUF em percentual' }
            ibs_mun_rate: { type: string, description: 'pIBSMun em percentual' }
            cbs_rate: { type: string, description: 'pCBS em percentual' }
        authorized_xml:
          type: array
          maxItems: 10
          description: |
            autXML. CPF ou CNPJ com dígito verificador (CNPJ alfanumérico incluso), sem repetição e sem repetir
            parte do CT-e; senão 422 `autxml_invalid`.
          items:
            type: object
            required: [ doc ]
            properties:
              doc: { type: string }
        icms:
          type: [ object, 'null' ]
          description: Omitido = ICMSSN para CRT 1, 2 ou 4; obrigatório no regime normal.
          required: [ cst ]
          properties:
            cst: { type: string, enum: [ '00', '20', '40', '41', '51', '60', '90', SN ] }
            p_icms: { type: [ string, 'null' ] }
            p_red_bc: { type: [ string, 'null' ] }
        cfop:
          type: [ string, 'null' ]
          description: CFOP da prestação. Obrigatório na emissão (422 `cfop_required`); nunca presumido.
        overrides:
          type: [ object, 'null' ]
          properties:
            sender_person_id: { type: [ string, 'null' ] }
            recipient_person_id: { type: [ string, 'null' ] }
            cargo:
              type: [ object, 'null' ]
              properties:
                total_value: { type: [ string, 'null' ] }
                total_weight_kg: { type: [ string, 'null' ] }
                volumes: { type: [ integer, 'null' ] }
                predominant_product: { type: [ string, 'null' ], maxLength: 60 }
            origin:
              type: [ object, 'null' ]
              properties:
                city_ibge: { $ref: '#/components/schemas/Ibge' }
            destination:
              type: [ object, 'null' ]
              properties:
                city_ibge: { $ref: '#/components/schemas/Ibge' }
        additional_info: { type: [ string, 'null' ], maxLength: 2000 }

    CteChargeProps:
      type: object
      description: Valor e tributos do complemento e do substituto (mesmos campos de `CteEmitBody`).
      properties:
        freight: { $ref: '#/components/schemas/CteEmitBody/properties/freight' }
        icms: { $ref: '#/components/schemas/CteEmitBody/properties/icms' }
        ibs_cbs: { $ref: '#/components/schemas/CteEmitBody/properties/ibs_cbs' }
        authorized_xml: { $ref: '#/components/schemas/CteEmitBody/properties/authorized_xml' }
        cfop: { $ref: '#/components/schemas/CteEmitBody/properties/cfop' }
        additional_info: { $ref: '#/components/schemas/CteEmitBody/properties/additional_info' }

    CteComplementBody:
      allOf:
        - $ref: '#/components/schemas/CteChargeProps'
        - type: object
          required: [ original_keys, freight ]
          properties:
            original_keys:
              type: array
              minItems: 1
              maxItems: 10
              uniqueItems: true
              items: { type: string, pattern: '^\d{44}$' }
              description: Chaves dos CT-e autorizados da organização a complementar (infCteComp/chCTe).

    CteSubstituteBody:
      allOf:
        - $ref: '#/components/schemas/CteChargeProps'
        - type: object
          required: [ original_key, freight ]
          properties:
            original_key: { type: string, pattern: '^\d{44}$', description: Chave do CT-e substituído (infCteSub/chCte). }
            change_taker: { type: boolean, description: 'Liga indAlteraToma=1. Sem ele, o tomador é o do original.' }
            taker:
              type: [ object, 'null' ]
              description: Só com `change_taker`. toma3 (papel existente no original e diferente do atual) ou `outro` com `person_id` (toma4).
              required: [ role ]
              properties:
                role: { type: string, enum: [ remetente, destinatario, expedidor, recebedor, outro ] }
                person_id: { type: [ string, 'null' ] }

    CteOsPlace:
      type: object
      required: [ city_ibge, city, uf ]
      properties:
        city_ibge: { $ref: '#/components/schemas/Ibge' }
        city: { type: string, minLength: 2, maxLength: 60 }
        uf: { type: string, minLength: 2, maxLength: 2 }

    CteOsEmitBody:
      allOf:
        - $ref: '#/components/schemas/CteChargeProps'
        - type: object
          required: [ service_type, taker, service, freight ]
          properties:
            service_type: { type: string, enum: [ people, values, baggage ] }
            taker:
              type: object
              required: [ person_id ]
              properties: { person_id: { type: string } }
            service:
              type: object
              required: [ description ]
              properties:
                description: { type: string, maxLength: 30, description: xDescServ }
                quantity: { type: [ string, 'null' ], description: 'qCarga: passageiros, volumes ou malotes' }
            origin: { oneOf: [ { $ref: '#/components/schemas/CteOsPlace' }, { type: 'null' } ] }
            destination: { oneOf: [ { $ref: '#/components/schemas/CteOsPlace' }, { type: 'null' } ] }
            route_ufs: { type: array, maxItems: 25, items: { type: string, minLength: 2, maxLength: 2 } }
            road:
              type: [ object, 'null' ]
              description: rodoOS. Obrigatório em people e baggage; proibido em values.
              properties:
                taf: { type: [ string, 'null' ], description: '12 dígitos; interestadual de pessoas' }
                state_registration: { type: [ string, 'null' ], description: '25 dígitos; interna de pessoas' }
                vehicle:
                  type: [ object, 'null' ]
                  properties:
                    plate: { type: string }
                    renavam: { type: [ string, 'null' ] }
                    uf: { type: [ string, 'null' ] }
                charter:
                  type: [ object, 'null' ]
                  description: infFretamento. Obrigatório em people.
                  properties:
                    type: { type: integer, enum: [ 1, 2 ], description: '1 eventual (exige trip_at), 2 contínuo' }
                    trip_at: { type: [ string, 'null' ], format: date-time }
            doc_refs:
              type: array
              description: infDocRef. Obrigatório em baggage; proibido nos outros.
              items:
                type: object
                properties:
                  bpe_key: { type: [ string, 'null' ] }
                  number: { type: [ string, 'null' ] }
                  serie: { type: [ string, 'null' ] }
                  subserie: { type: [ string, 'null' ] }
                  issued_on: { type: [ string, 'null' ], format: date }
                  amount: { type: [ string, 'null' ] }
            gtve:
              type: array
              description: infGTVe. Obrigatório em values; proibido nos outros.
              items:
                type: object
                required: [ key, components ]
                properties:
                  key: { type: string, pattern: '^\d{44}$' }
                  components:
                    type: array
                    items:
                      type: object
                      required: [ type, value ]
                      properties:
                        type: { type: integer, minimum: 1, maximum: 6, description: '6 = outros (exige name)' }
                        value: { type: string }
                        name: { type: [ string, 'null' ], maxLength: 15 }
            federal_taxes:
              type: [ object, 'null' ]
              description: infTribFed. `inss` é obrigatório em people com tomador pessoa jurídica (H057).
              properties:
                pis: { type: [ string, 'null' ] }
                cofins: { type: [ string, 'null' ] }
                ir: { type: [ string, 'null' ] }
                inss: { type: [ string, 'null' ] }
                csll: { type: [ string, 'null' ] }

    CteDocument:
      allOf:
        - $ref: '#/components/schemas/FiscalDocument'
        - type: object
          properties:
            freight_total: { type: string }
            cfop: { type: string }
            icms_cst: { type: string }
            model: { type: string, description: '`67` no CT-e OS; ausente no CT-e 57.' }
            os_service: { type: string, enum: [ people, values, baggage ] }
            cte_type: { type: string, enum: [ complement, substitute ], description: Ausente no CT-e normal. }
            complemented_keys: { type: array, items: { type: string } }
            substituted_key: { type: string }
            sender: { type: object, properties: { doc: { type: string }, name: { type: string } } }
            recipient: { type: object, properties: { doc: { type: string }, name: { type: string } } }
            taker:
              type: object
              properties:
                role: { type: string }
                doc: { type: string }
                name: { type: string }
            nfe_keys: { type: array, items: { type: string } }
            origin: { $ref: '#/components/schemas/CtePlace' }
            destination: { $ref: '#/components/schemas/CtePlace' }
            cargo:
              type: object
              properties:
                total_value: { type: string }
                total_weight_kg: { type: string }
                volumes: { type: integer }
                predominant_product: { type: string }
