components:

  parameters:
    RegistryName:
      name: name
      in: query
      required: false
      description: Filtra por prefixo do nome (usa o GSI `name-index`).
      schema: { type: string }

  schemas:

    TaxProfileBody:
      description: |
        Um tratamento tributário nomeado, aplicado a um conjunto de CFOPs e
        reutilizado por vários produtos. `5102` e `6102` normalmente
        compartilham o mesmo perfil: a alíquota interestadual já é resolvida na
        emissão, então o que muda entre eles é dado derivado, não configuração.
        Quando o tratamento realmente difere por CFOP, crie um segundo perfil —
        não há aninhamento por CFOP dentro do perfil.
      allOf:
        - type: object
          required: [ name, cfops ]
          properties:
            name: { type: string, minLength: 2, maxLength: 120 }
            description: { type: [ string, 'null' ], maxLength: 255 }
            cfops:
              type: array
              minItems: 1
              description: CFOPs cobertos por este perfil.
              items: { $ref: '#/components/schemas/Cfop' }
        - $ref: '#/components/schemas/TaxFieldsBody'

    TaxProfileItem:
      type: object
      description: Perfil fiscal persistido.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string, description: Identificador do perfil. }
        name: { type: string }
        description: { type: [ string, 'null' ] }
        cfops:
          type: array
          items: { $ref: '#/components/schemas/Cfop' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ServiceLocationAddressBody:
      type: object
      description: >-
        Endereço do local. Nacional usa `postal_code` + `city_ibge_code`; exterior usa
        `foreign_postal_code` + `foreign_city` + `foreign_region`. É a mesma escolha exclusiva de
        `TCEnderecoSimples`: um endereço pela metade só falharia na emissão, longe de quem digitou.
      required: [ street, number, neighborhood ]
      properties:
        street: { type: string, maxLength: 255 }
        number: { type: string, maxLength: 60 }
        complement: { type: [ string, 'null' ], maxLength: 156 }
        neighborhood: { type: string, maxLength: 60 }
        postal_code: { type: [ string, 'null' ], pattern: '^\d{8}$' }
        city_ibge_code: { type: [ string, 'null' ], pattern: '^\d{7}$' }
        foreign_postal_code: { type: [ string, 'null' ], maxLength: 11 }
        foreign_city: { type: [ string, 'null' ], maxLength: 60 }
        foreign_region: { type: [ string, 'null' ], maxLength: 60 }

    ServiceLocationBody:
      type: object
      description: |
        Local de prestação de serviço: obra, imóvel e local de evento num cadastro só.

        Os papéis são **combináveis** porque o XSD repete o mesmo endereço em `serv/obra`,
        `serv/atvEvento` e `IBSCBS/imovel` — um canteiro que também é o endereço do imóvel tributado
        seria dois cadastros idênticos se os papéis fossem exclusivos.

        `c_obra` e `cib` são mutuamente exclusivos: `serv/obra` é a escolha `cObra|cCIB|end`, e
        guardar os dois deixaria a emissão decidir em silêncio qual ramo gerar. CNO, CIB e inscrição
        imobiliária são registros brasileiros e são recusados num endereço no exterior.
      required: [ name, roles, address ]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        roles:
          type: array
          minItems: 1
          items: { type: string, enum: [ work, property, event_venue ] }
        address: { $ref: '#/components/schemas/ServiceLocationAddressBody' }
        insc_imob_fisc: { type: [ string, 'null' ], minLength: 1, maxLength: 30 }
        c_obra: { type: [ string, 'null' ], minLength: 1, maxLength: 30 }
        cib: { type: [ string, 'null' ], minLength: 8, maxLength: 8 }
        id_atv_evt:
          type: [ string, 'null' ]
          minLength: 1
          maxLength: 30
          description: Nome e período do evento variam por nota e vão no request de emissão.

    ServiceLocationItem:
      type: object
      description: Local de prestação persistido.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string, description: Identificador do local. }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReferenceDocumentDFeBody:
      type: object
      description: >-
        Documento do Repositório Nacional pela chave. Em `vDedRed`, `tipo_chave_dfe` decide entre
        `chNFSe` (NFS-e, 50 dígitos) e `chNFe` (NF-e, 44) — tipo e comprimento têm de concordar.
      required: [ tipo_chave_dfe, chave_dfe ]
      properties:
        tipo_chave_dfe: { type: string, description: Domínio `TSRTCTipoChaveDFe`. }
        chave_dfe: { type: string, minLength: 1, maxLength: 50, pattern: '^\d+$' }
        x_tipo_chave_dfe: { type: [ string, 'null' ], minLength: 1, maxLength: 255 }

    ReferenceDocumentNFSeMunBody:
      type: object
      description: NFS-e municipal anterior ao Sistema Nacional (`TCDocOutNFSe`).
      required: [ c_mun_nfse_mun, n_nfse_mun, c_verif_nfse_mun ]
      properties:
        c_mun_nfse_mun: { type: string, pattern: '^\d{7}$' }
        n_nfse_mun: { type: string, pattern: '^\d{15}$' }
        c_verif_nfse_mun: { type: string, minLength: 1, maxLength: 9 }

    ReferenceDocumentNFNFSBody:
      type: object
      description: Nota fiscal ou nota fiscal de serviço não eletrônica (`TCDocNFNFS`).
      required: [ n_nfs, mod_nfs, serie_nfs ]
      properties:
        n_nfs: { type: string, pattern: '^\d{7}$' }
        mod_nfs: { type: string, pattern: '^\d{15}$' }
        serie_nfs: { type: string, minLength: 1, maxLength: 15 }

    ReferenceDocumentTaxOtherBody:
      type: object
      description: >-
        Outro documento fiscal. Município e descrição só existem em `gReeRepRes`; em `vDedRed` o
        leiaute pede apenas o número, que sai daqui sem cadastro extra.
      required: [ n_doc_fiscal ]
      properties:
        n_doc_fiscal: { type: string, minLength: 1, maxLength: 255 }
        c_mun_doc_fiscal: { type: [ string, 'null' ], pattern: '^\d{7}$' }
        x_doc_fiscal: { type: [ string, 'null' ], minLength: 1, maxLength: 255 }

    ReferenceDocumentNonFiscalBody:
      type: object
      description: Documento não fiscal (recibo, contrato).
      required: [ n_doc ]
      properties:
        n_doc: { type: string, minLength: 1, maxLength: 255 }
        x_doc: { type: [ string, 'null' ], minLength: 1, maxLength: 255 }

    ReferenceDocumentBody:
      type: object
      description: |
        Documento referenciado em dedução/redução (`vDedRed/documentos`) e em reembolso, repasse ou
        ressarcimento (`gReeRepRes/documentos`). O leiaute pede formas diferentes do mesmo documento
        nos dois grupos; cadastrar duas vezes convidaria a divergência.

        União tipada: `kind` decide qual subobjeto é **obrigatório**, e os demais têm de estar
        **ausentes** — com dois preenchidos, a emissão escolheria em silêncio qual ramo do
        `xs:choice` gerar.

        `supplier_person_id` aponta o fornecedor no cadastro de pessoas; nunca é copiado.
      required: [ name, kind, issued_at ]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        kind:
          type: string
          enum: [ dfe, nfse_municipal, nf_nfs, doc_fiscal_outro, doc_nao_fiscal ]
        dfe: { $ref: '#/components/schemas/ReferenceDocumentDFeBody' }
        nfse_municipal: { $ref: '#/components/schemas/ReferenceDocumentNFSeMunBody' }
        nf_nfs: { $ref: '#/components/schemas/ReferenceDocumentNFNFSBody' }
        doc_fiscal_outro: { $ref: '#/components/schemas/ReferenceDocumentTaxOtherBody' }
        doc_nao_fiscal: { $ref: '#/components/schemas/ReferenceDocumentNonFiscalBody' }
        supplier_person_id: { type: [ string, 'null' ] }
        issued_at: { type: string, format: date }
        competence_at:
          type: [ string, 'null' ]
          format: date
          description: Não pode ser anterior a `issued_at`.
        description: { type: [ string, 'null' ], minLength: 1, maxLength: 150 }

    ReferenceDocumentItem:
      type: object
      description: Documento referenciado persistido.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string, description: Identificador do documento. }
        name: { type: string }
        kind: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OperationBody:
      type: object
      description: |
        Natureza de operação — os valores que sempre andam juntos por cenário de
        negócio ("venda para revenda", "remessa para conserto", "devolução de
        compra"). Na emissão, **valor explícito no request sempre vence a
        operação**: ela é default, não prisão.
      required: [ name ]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        doc_types:
          type: array
          items: { type: string, enum: [ nfe, nfce, cte, mdfe, nfse ] }
        nat_op: { type: [ string, 'null' ], maxLength: 60 }
        tp_nf: { type: [ string, 'null' ], enum: [ '0', '1', null ] }
        fin_nfe: { type: [ string, 'null' ], enum: [ '1', '2', '3', '4', null ] }
        ind_final: { type: [ string, 'null' ], enum: [ '0', '1', null ] }
        ind_pres: { type: [ string, 'null' ], enum: [ '0', '1', '2', '3', '4', '5', '9', null ] }
        cfop_suffix:
          type: [ string, 'null' ]
          pattern: '^\d{3}$'
          description: |
            Natureza fiscal (3 dígitos). O dígito de escopo (`5` intra-UF,
            `6` inter-UF, `7` exterior) é resolvido na emissão a partir das UFs
            de emitente e destinatário. Sem variante para o escopo exigido, a
            emissão é **bloqueada** com mensagem acionável — nada de sintetizar CFOP.
        tax_profile_id: { type: [ string, 'null' ] }
        payment_term_id: { type: [ string, 'null' ] }
        mod_frete: { type: [ string, 'null' ], enum: [ '0', '1', '2', '3', '4', '9', null ] }
        inf_ad_fisco:
          type: [ string, 'null' ]
          maxLength: 2000
          description: |
            Aceita placeholders `{{chave}}`: `{{v_nf}}`, `{{v_icms_st}}`,
            `{{cliente}}`, `{{nat_op}}`, `{{competencia}}`. Chave desconhecida é
            erro de validação **no cadastro**, nunca interpolação em branco no XML.
        inf_cpl: { type: [ string, 'null' ], maxLength: 5000 }
        export_uf_saida_pais:
          type: [ string, 'null' ]
          description: UF de saída do país (`infNFe/exporta/UFSaidaPais`).
        export_loc_despacho_index:
          type: [ integer, 'null' ]
          description: |
            Índice em `organizations.pickup_locations` do recinto de despacho —
            o endereço é referenciado, nunca recopiado.
        ret_trib:
          type: [ object, 'null' ]
          description: |
            Perfil de retenções federais do cenário (`total/retTrib`). Só os
            percentuais ficam aqui; `vRetPIS`, `vRetCOFINS`, `vRetCSLL`,
            `vIRRF` e `vRetPrev` são calculados sobre a base da nota.
          properties:
            p_ret_pis: { type: [ string, 'null' ] }
            p_ret_cofins: { type: [ string, 'null' ] }
            p_ret_csll: { type: [ string, 'null' ] }
            p_ret_irrf: { type: [ string, 'null' ] }
            p_ret_prev_inss: { type: [ string, 'null' ] }
        intermediary_person_id:
          type: [ string, 'null' ]
          description: |
            Pessoa (papel `intermediary`) do marketplace/plataforma do cenário.
            Vira `infNFe/infIntermed` — `CNPJ` do sk e `idCadIntTran` de
            `person.intermediary_id`. Uma operação por canal de venda.
        ind_intermed:
          type: [ string, 'null' ]
          enum: [ '0', '1', null ]
          description: '`0` site/plataforma própria · `1` plataforma de terceiros (`ide/indIntermed`).'
        dh_sai_ent_offset_days:
          type: [ integer, 'null' ]
          minimum: 0
          maximum: 365
          description: |
            Prazo padrão de saída da mercadoria, em dias corridos a partir da
            emissão (`ide/dhSaiEnt`). Quem despacha sempre no dia seguinte
            cadastra `1` e nunca mais digita a data; `dh_sai_ent` no request
            vence.
        c_ind_op:
          type: [ string, 'null' ]
          pattern: '^\d{6}$'
          description: Código indicador do local da operação de fornecimento (`ide/cIndOp`).
        c_mun_fg_ibs:
          type: [ string, 'null' ]
          pattern: '^\d{7}$'
          description: |
            Município do fato gerador do IBS/CBS (`ide/cMunFGIBS`). O leiaute só
            o aceita quando `ind_pres` é 5 e não há endereço de destinatário nem
            local de entrega.
        tp_nf_debito:
          type: [ string, 'null' ]
          enum: [ '01', '02', '03', '04', '05', '06', '07', '08', null ]
          description: |
            Motivo da nota de débito (`ide/tpNFDebito`, `TTpNFDebito`):
            `01` transferência de créditos para cooperativas ·
            `02` anulação de crédito por saídas imunes/isentas ·
            `03` débitos de notas não processadas na apuração ·
            `04` multa e juros · `05` transferência de crédito na sucessão ·
            `06` pagamento antecipado · `07` perda em estoque ·
            `08` desenquadramento do Simples Nacional.
        tp_nf_credito:
          type: [ string, 'null' ]
          enum: [ '01', '02', '03', '04', '05', '06', null ]
          description: |
            Motivo da nota de crédito (`ide/tpNFCredito`, `TTpNFCredito`):
            `01` multa e juros ·
            `02` crédito presumido de IBS sobre saldo devedor na ZFM ·
            `03` retorno por recusa na entrega ou destinatário não localizado ·
            `04` redução de valores · `05` transferência de crédito na sucessão ·
            `06` retorno por recusa parcial na entrega.
        compra_gov_tp_ente:
          type: [ string, 'null' ]
          enum: [ '1', '2', '3', '4', '5', '6', null ]
          description: |
            Ente governamental (`ide/gCompraGov/tpEnteGov`): `1` União ·
            `2` Estados · `3` DF · `4` Municípios · `5` Consórcio Público ·
            `6` Comitê Gestor do IBS. Presente, habilita o grupo.
        compra_gov_p_redutor:
          type: [ string, 'null' ]
          pattern: '^\d{1,3}(\.\d{1,4})?$'
          description: Percentual de redução de alíquota em compra governamental.
        compra_gov_tp_oper:
          type: [ string, 'null' ]
          enum: [ '1', '2', '3', '4', null ]
          description: |
            Tipo da operação (`tpOperGov`): `1` fornecimento com pagamento
            posterior · `2` recebimento do pagamento com fornecimento já
            realizado · `3` fornecimento com pagamento já realizado ·
            `4` recebimento do pagamento com fornecimento posterior.

            A regra do `refDFeAnt` é validada na emissão: **obrigatório** em 2 e
            3, **vedado** em 1 e 4, e no tipo 2 aceita **uma** chave só.
        compra_x_n_emp:
          type: [ string, 'null' ]
          minLength: 1
          maxLength: 22
          description: |
            Nota de empenho da venda a órgão público (`infNFe/compra/xNEmp`).
            Quem vende por empenho vende sempre por empenho; pedido e contrato
            variam por nota e vão no request de emissão.
        cana_safra:
          type: [ string, 'null' ]
          minLength: 4
          maxLength: 9
          description: |
            Safra do registro de aquisição de cana (`infNFe/cana/safra`), ex.
            `2025/2026`. Sem ela cadastrada, a emissão com `cana` é 400.
        requires_receiver:
          type: [ boolean, 'null' ]
          description: '`false` habilita emissão sem destinatário (self_issuance).'
        is_default:
          type: boolean
          description: |
            Operação pré-selecionada da organização. Só uma pode estar marcada:
            marcar uma desmarca a anterior no mesmo `TransactWrite`. Vale para NFS-e apenas quando
            `doc_types` inclui `nfse` — não existe um segundo default implícito.
        nfse: { $ref: '#/components/schemas/OperationNfseBody' }

    OperationNfseBody:
      type: object
      description: |
        Defaults de NFS-e da natureza de operação, usados quando `doc_types` inclui `nfse`.
        Fica num subobjeto porque quase nada do resto da operação se aplica à NFS-e: a competência
        é municipal e não há CFOP, `tpNF` nem volume.

        A ordem de resolução na emissão é **operação → serviço → request**: o request sempre vence,
        e o serviço vence a operação, porque o serviço descreve a atividade e a operação é só o
        cenário de negócio.
      properties:
        c_loc_prestacao:
          type: [ string, 'null' ]
          pattern: '^\d{7}$'
          description: Escolha exclusiva com `c_pais_prestacao`, como `TCLocPrest` no XSD.
        c_pais_prestacao: { type: [ string, 'null' ], minLength: 2, maxLength: 2 }
        foreign_trade: { $ref: '#/components/schemas/ServiceForeignTradeDefaultsBody' }
        id_doc_tec: { type: [ string, 'null' ], maxLength: 20 }
        doc_ref: { type: [ string, 'null' ], maxLength: 255 }
        x_ped: { type: [ string, 'null' ], maxLength: 20 }
        p_desc_incond: { type: [ string, 'null' ], pattern: '^\d{1,3}(\.\d{1,4})?$' }
        p_desc_cond: { type: [ string, 'null' ], pattern: '^\d{1,3}(\.\d{1,4})?$' }
        ind_final: { type: [ string, 'null' ], description: Domínio `TSRTCIndFinal`. }
        tp_oper: { type: [ string, 'null' ], description: Domínio `TSRTCTpOper`. }
        ind_dest: { type: [ string, 'null' ], description: Domínio `TSRTCIndDest`. }
        tp_ente_gov: { type: [ string, 'null' ], description: Domínio `TSRTCTpEnteGov`. }
        x_inf_comp:
          type: [ string, 'null' ]
          maxLength: 2000
          description: Aceita os mesmos placeholders de `inf_cpl`; vira `serv/infoCompl/xInfComp`.

    OperationItem:
      type: object
      description: Natureza de operação persistida.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string, description: Identificador da natureza de operação. }
        name: { type: string }
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PaymentTermBody:
      type: object
      description: |
        Condição de pagamento nomeada ("30/60/90", "à vista", "boleto 28 dias").
        Na emissão, `payment_term_id` + o total do documento expandem para
        `payments`, `cobr_fat` e `cobr_duplicatas`. **A última parcela absorve o
        resíduo de arredondamento**: a soma das duplicatas fecha com `vNF`
        centavo a centavo. Valores explícitos no request vencem a expansão.
      required: [ name, payment_type, installments ]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        payment_type:
          type: string
          description: Mesmo domínio de `NfePaymentItem.payment_type`.
        ind_pag:
          type: [ string, 'null' ]
          enum: [ '0', '1', null ]
          description: |
            `0` à vista, `1` a prazo. Ausente, é derivado: uma parcela com
            vencimento imediato é à vista, qualquer outra coisa é a prazo.
        installments: { type: integer, minimum: 1, maximum: 120 }
        interval_days: { type: integer, minimum: 0, maximum: 365, description: Intervalo entre parcelas. }
        first_due_days: { type: integer, minimum: 0, maximum: 365, description: Dias até o primeiro vencimento. }
        card:
          type: [ object, 'null' ]
          additionalProperties: true
          description: Mesmos campos de `NfePaymentItem.card`.

    PaymentTermItem:
      type: object
      description: Condição de pagamento persistida.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string }
        name: { type: string }
        payment_type: { type: string }
        installments: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PaymentTerminalBody:
      type: object
      description: |
        Terminal de captura (POS). CNPJ recebedor e identificador do terminal são
        invariantes por maquininha: a NFC-e só aponta `terminal_id` no pagamento
        e o builder preenche `detPag/CNPJPag`, `detPag/UFPag`, `card/CNPJReceb`
        e `card/idTermPag`.
      required: [ name, cnpj_receb, id_term_pag ]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        cnpj_receb:
          type: string
          description: CNPJ do estabelecimento credenciado que recebe o pagamento.
        id_term_pag:
          type: string
          maxLength: 40
          description: Identificador do terminal, atribuído pela adquirente.
        cnpj_pag:
          type: [ string, 'null' ]
          description: |
            Pagador institucional, quando a operação de pagamento ocorre fora do
            estabelecimento emitente. `uf_pag` só é válido acompanhado dele.
        uf_pag: { type: [ string, 'null' ] }
        t_band:
          type: [ string, 'null' ]
          maxLength: 2
          description: Bandeira default (`card/tBand`). Sobrescrevível na emissão.

    PaymentTerminalItem:
      type: object
      description: Terminal de pagamento persistido.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string }
        name: { type: string }
        cnpj_receb: { type: string }
        id_term_pag: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TollProviderBody:
      type: object
      description: |
        Fornecedora de vale-pedágio. O vale é obrigatório no transporte
        rodoviário de carga (Lei 10.209); a fornecedora e o pagador são
        invariantes, então por viagem só entram `n_compra` e `v_vale_ped` no
        corpo da emissão do MDF-e (`toll_vouchers[]`).
      required: [ name, cnpj_forn ]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        cnpj_forn: { type: string, description: CNPJ da fornecedora do vale-pedágio. }
        cnpj_pg:
          type: [ string, 'null' ]
          description: Pagador do vale quando não é o emitente. Choice com `cpf_pg` — nunca os dois.
        cpf_pg: { type: [ string, 'null' ] }
        tp_vale_ped:
          type: [ string, 'null' ]
          enum: [ '01', '02', '03', null ]
          description: '`01` TAG · `02` cupom · `03` cartão.'

    TollProviderItem:
      type: object
      description: Fornecedora de vale-pedágio persistida.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string }
        name: { type: string }
        cnpj_forn: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CargoUnitBody:
      type: object
      description: |
        Unidade de transporte (carreta, vagão) ou de carga (contêiner, pallet).
        Recorre entre viagens, então identificação, tipo e lacres fixos ficam no
        cadastro. O rateio (`qtdRat`) **não** vive aqui: é calculado dos pesos
        dos documentos a cada manifesto.
      required: [ name, kind, tp_unid, id_unid ]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        kind:
          type: string
          enum: [ transport, cargo ]
          description: Separa `infUnidTransp` de `infUnidCarga` — mesma estrutura, nó diferente.
        tp_unid:
          type: string
          enum: [ '1', '2', '3', '4', '5', '6', '7' ]
          description: |
            `tpUnidTransp`: 1 rodoviário tração · 2 rodoviário reboque · 3 navio ·
            4 balsa · 5 aeronave · 6 vagão · 7 outros.
            `tpUnidCarga`: 1 contêiner · 2 ULD · 3 pallet · 4 outros.
        id_unid: { type: string, maxLength: 20, description: Placa, número do contêiner ou do vagão. }
        seals:
          type: array
          description: Lacres fixos da unidade (`lacUnidTransp` / `lacUnidCarga`).
          items: { type: string, maxLength: 60 }

    CargoUnitItem:
      type: object
      description: Unidade de transporte ou de carga persistida.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string }
        name: { type: string }
        kind: { type: string }
        tp_unid: { type: string }
        id_unid: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FuelPumpBody:
      type: object
      description: |
        Bico, bomba e tanque do posto. A leitura do encerrante
        (`last_v_enc_fin`) **não** entra aqui: ela é escrita pela emissão, na
        mesma transação que reserva o número da nota. O `vEncIni` de cada venda
        é o `vEncFin` da venda anterior da mesma bomba.
      required: [ name, n_bico ]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        n_bico: { type: string, maxLength: 3, description: '`encerrante/nBico`.' }
        n_bomba: { type: string, maxLength: 3, description: '`encerrante/nBomba`.' }
        n_tanque: { type: string, maxLength: 3, description: '`encerrante/nTanque`.' }

    FuelPumpItem:
      type: object
      description: Bomba persistida.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string }
        name: { type: string }
        n_bico: { type: string }
        last_v_enc_fin:
          type: string
          description: |
            Última leitura final gravada pela emissão. Somente leitura — o PUT
            não a altera.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProductLotBody:
      type: object
      description: |
        Lote de produção (`prod/rastro`). O lote é do produto e reaparece em
        várias notas até acabar, por isso é cadastro: a emissão só aponta qual
        lote saiu no item, e a quantidade (`qLote`) é rateada da quantidade
        vendida.
      required: [ name, product_id, n_lote, q_lote, d_fab, d_val ]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        product_id:
          type: string
          description: Produto que fabricou o lote. Um lote não sai no item de outro produto (400).
        n_lote: { type: string, maxLength: 20 }
        q_lote:
          type: string
          description: Quantidade produzida no lote. A quantidade que sai por nota vem do item.
        d_fab: { type: string, format: date }
        d_val:
          type: string
          format: date
          description: Não pode ser anterior a `d_fab` — validado no cadastro.
        c_agreg: { type: [ string, 'null' ], maxLength: 20 }

    ProductLotItem:
      type: object
      description: Lote de produção persistido.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string }
        name: { type: string }
        product_id: { type: string }
        n_lote: { type: string }
        d_val: { type: string, format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InsurancePolicyBody:
      type: object
      description: |
        Apólice de seguro da carga (`infMDFe/seg`). A apólice e a seguradora
        recorrem entre viagens; por viagem muda só a averbação, que vai no
        corpo da emissão do MDF-e.
      required: [ name, resp_seg ]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        resp_seg:
          type: string
          enum: [ '1', '2' ]
          description: '`1` emitente do MDF-e · `2` contratante do serviço de transporte.'
        cnpj:
          type: [ string, 'null' ]
          description: Documento do responsável, obrigatório quando `resp_seg = 2`. Exclusivo com `cpf`.
        cpf: { type: [ string, 'null' ] }
        x_seg:
          type: [ string, 'null' ]
          minLength: 2
          maxLength: 30
          description: Nome da seguradora. Informado junto com `cnpj_seg` ou nenhum dos dois.
        cnpj_seg: { type: [ string, 'null' ] }
        n_apol: { type: [ string, 'null' ], maxLength: 20 }

    InsurancePolicyItem:
      type: object
      description: Apólice de seguro persistida.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string }
        name: { type: string }
        resp_seg: { type: string }
        n_apol: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ImportDeclarationBody:
      type: object
      description: |
        Declaração de importação. Uma DI cobre várias notas e vários itens, por
        isso é cadastro e não campo de emissão: o item só aponta qual adição o
        representa, e `nAdicao`/`nSeqAdic` saem desse vínculo.
      required: [ name, n_di, d_di, x_loc_desemb, uf_desemb, d_desemb, tp_via_transp, tp_intermedio, c_exportador, additions ]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        n_di: { type: string, maxLength: 15 }
        d_di: { type: string, format: date }
        x_loc_desemb: { type: string, maxLength: 60 }
        uf_desemb: { $ref: '#/components/schemas/Uf' }
        d_desemb: { type: string, format: date }
        tp_via_transp:
          type: string
          pattern: '^\d{2}$'
          description: '`01` marítima … `12` por reboque (TViaTransp).'
        v_afrmm:
          type: [ string, 'null' ]
          description: Obrigatório quando `tp_via_transp = 01` (marítima) — validado no cadastro.
        tp_intermedio:
          type: string
          enum: [ '1', '2', '3' ]
          description: '`1` conta própria · `2` conta e ordem · `3` encomenda.'
        cnpj: { type: [ string, 'null' ] }
        uf_terceiro: { type: [ string, 'null' ] }
        c_exportador: { type: string, maxLength: 60 }
        additions:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ImportAdditionBody' }

    ImportAdditionBody:
      type: object
      required: [ n_adicao, c_fabricante ]
      properties:
        n_adicao: { type: string, maxLength: 3 }
        c_fabricante: { type: string, maxLength: 60 }
        v_desc_di: { type: [ string, 'null' ] }
        n_draw: { type: [ string, 'null' ], maxLength: 20 }

    ImportDeclarationItem:
      type: object
      description: Declaração de importação persistida.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string }
        name: { type: string }
        n_di: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VehicleSetBody:
      type: object
      description: |
        Composição veicular — trator, até 3 reboques e condutores escolhidos de
        uma vez ("Carreta 1 — ABC1D23"). Na emissão do MDF-e, `vehicle_set_id`
        expande para `vehicle`, `trailers`, `drivers`, `rntrc` e `ciot`, e
        **cada campo continua sobrescrevível individualmente no mesmo request** —
        trocar o motorista de um dia não exige criar outro conjunto.

        O trator tem que ter `role=tractor` e cada reboque `role=trailer`; a
        checagem acontece no cadastro, não na emissão.
      required: [ name, tractor_sk ]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        tractor_sk: { type: string, description: 'SK do veículo de tração (role=tractor).' }
        trailer_sks:
          type: array
          maxItems: 3
          items: { type: string }
          description: 'SKs dos reboques (role=trailer).'
        driver_docs:
          type: array
          items: { $ref: '#/components/schemas/Cpf' }
          description: CPFs de pessoas do cadastro, tipicamente com o papel `driver`.
        rntrc: { type: [ string, 'null' ] }
        ciot: { type: [ string, 'null' ] }

    VehicleSetItem:
      type: object
      description: Composição veicular persistida.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string }
        name: { type: string }
        tractor_sk: { type: string }
        trailer_sks: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
