# Cadastros reutilizáveis — as decisões que antes eram redigitadas a cada
# emissão, guardadas uma vez e referenciadas por id.
#
# Todos compartilham a mesma forma (pk = organização, sk = {PREFIXO}_{uuid},
# GSI `name-index`), então compartilham também o mesmo conjunto de rotas.

paths:

  # ── Perfis fiscais ─────────────────────────────────────────────────────────

  /v1.0/tax-profiles:
    get:
      tags: [TaxProfiles]
      summary: Lista perfis fiscais
      operationId: listTaxProfiles
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/RegistryName'
      responses:
        '200':
          description: Página de perfis fiscais
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TaxProfileItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [TaxProfiles]
      summary: Cria um perfil fiscal
      operationId: createTaxProfile
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxProfileBody' }
      responses:
        '201':
          description: Perfil fiscal criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxProfileItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/tax-profiles/{tax_profile_id}:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - name: tax_profile_id
        in: path
        required: true
        description: Identificador do perfil (SK da linha).
        schema: { type: string }
    get:
      tags: [TaxProfiles]
      summary: Detalha um perfil fiscal
      operationId: getTaxProfile
      responses:
        '200':
          description: Perfil fiscal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxProfileItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [TaxProfiles]
      summary: Atualiza um perfil fiscal
      operationId: updateTaxProfile
      description: |
        Editar um perfil muda a tributação de **toda** emissão futura dos
        produtos que o referenciam. Documentos já emitidos não são afetados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxProfileBody' }
      responses:
        '200':
          description: Perfil fiscal atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxProfileItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [TaxProfiles]
      summary: Remove um perfil fiscal
      operationId: deleteTaxProfile
      responses:
        '204':
          description: Perfil fiscal removido
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Tabela de alíquotas ─────────────────────────────────────────────────────

  /v1.0/tax-tables/icms-aliq:
    get:
      tags: [TaxProfiles]
      summary: Consulta a alíquota ICMS/FCP que o sistema resolveria
      operationId: previewIcmsAliq
      description: |
        Devolve a alíquota ICMS/FCP que a emissão resolveria para
        emit_uf/dest_uf/ncm, sem nenhum override — usada pelo frontend para
        avisar quando um override customizado diverge da tabela padrão.
      parameters:
        - name: emit_uf
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 2 }
        - name: dest_uf
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 2 }
        - name: ncm
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Alíquotas resolvidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  icms_aliq: { type: string, example: "18.00" }
                  fcp_aliq: { type: string, example: "2.00" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Naturezas de operação ──────────────────────────────────────────────────

  /v1.0/operations:
    get:
      tags: [Operations]
      summary: Lista naturezas de operação
      operationId: listOperations
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/RegistryName'
      responses:
        '200':
          description: Página de naturezas de operação
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OperationItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Operations]
      summary: Cria uma natureza de operação
      operationId: createOperation
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationBody' }
      responses:
        '201':
          description: Natureza de operação criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/operations/{operation_id}:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - name: operation_id
        in: path
        required: true
        description: Identificador da natureza de operação (SK da linha).
        schema: { type: string }
    get:
      tags: [Operations]
      summary: Detalha uma natureza de operação
      operationId: getOperation
      responses:
        '200':
          description: Natureza de operação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Operations]
      summary: Atualiza uma natureza de operação
      operationId: updateOperation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationBody' }
      responses:
        '200':
          description: Natureza de operação atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Operations]
      summary: Remove uma natureza de operação
      operationId: deleteOperation
      responses:
        '204':
          description: Natureza de operação removida
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Condições de pagamento ──────────────────────────────────────────────

  /v1.0/payment-terms:
    get:
      tags: [PaymentTerms]
      summary: Lista condições de pagamento
      operationId: listPaymentTerms
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/RegistryName'
      responses:
        '200':
          description: Página de condições de pagamento
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PaymentTermItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [PaymentTerms]
      summary: Cria uma condição de pagamento
      operationId: createPaymentTerm
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentTermBody' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentTermItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/payment-terms/{payment_term_id}:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - name: payment_term_id
        in: path
        required: true
        description: Identificador (SK da linha).
        schema: { type: string }
    get:
      tags: [PaymentTerms]
      summary: Detalha uma condição de pagamento
      operationId: getPaymentTerm
      responses:
        '200':
          description: Encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentTermItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [PaymentTerms]
      summary: Atualiza uma condição de pagamento
      operationId: updatePaymentTerm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentTermBody' }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentTermItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [PaymentTerms]
      summary: Remove uma condição de pagamento
      operationId: deletePaymentTerm
      responses:
        '204':
          description: Removido
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Composições veiculares ─────────────────────────────────────────────────

  /v1.0/vehicle-sets:
    get:
      tags: [VehicleSets]
      summary: Lista composições veiculares
      operationId: listVehicleSets
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/RegistryName'
      responses:
        '200':
          description: Página de composições veiculares
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/VehicleSetItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [VehicleSets]
      summary: Cria uma composição veicular
      operationId: createVehicleSet
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleSetBody' }
      responses:
        '201':
          description: Composição criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleSetItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/vehicle-sets/{vehicle_set_id}:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - name: vehicle_set_id
        in: path
        required: true
        description: Identificador da composição (SK da linha).
        schema: { type: string }
    get:
      tags: [VehicleSets]
      summary: Detalha uma composição veicular
      operationId: getVehicleSet
      responses:
        '200':
          description: Composição veicular
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleSetItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [VehicleSets]
      summary: Atualiza uma composição veicular
      operationId: updateVehicleSet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleSetBody' }
      responses:
        '200':
          description: Composição atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleSetItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [VehicleSets]
      summary: Remove uma composição veicular
      operationId: deleteVehicleSet
      responses:
        '204':
          description: Composição removida
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:

  parameters:
    RegistryName:
      name: name
      in: query
      required: false
      description: Filtra por prefixo do nome (usa o GSI `name-index`).
      schema: { type: string }

  schemas:

    TaxProfileBody:
      description: |
        Um tratamento tributário nomeado, aplicado a um conjunto de CFOPs e
        reutilizado por vários produtos. `5102` e `6102` normalmente
        compartilham o mesmo perfil: a alíquota interestadual já é resolvida na
        emissão, então o que muda entre eles é dado derivado, não configuração.
        Quando o tratamento realmente difere por CFOP, crie um segundo perfil —
        não há aninhamento por CFOP dentro do perfil.
      allOf:
        - type: object
          required: [name, cfops]
          properties:
            name: { type: string, minLength: 2, maxLength: 120 }
            description: { type: [string, 'null'], maxLength: 255 }
            cfops:
              type: array
              minItems: 1
              description: CFOPs cobertos por este perfil.
              items: { $ref: '#/components/schemas/Cfop' }
        - $ref: '#/components/schemas/TaxFieldsBody'

    TaxProfileItem:
      type: object
      description: Perfil fiscal persistido.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string, description: Identificador do perfil. }
        name: { type: string }
        description: { type: [string, 'null'] }
        cfops:
          type: array
          items: { $ref: '#/components/schemas/Cfop' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OperationBody:
      type: object
      description: |
        Natureza de operação — os valores que sempre andam juntos por cenário de
        negócio ("venda para revenda", "remessa para conserto", "devolução de
        compra"). Na emissão, **valor explícito no request sempre vence a
        operação**: ela é default, não prisão.
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        doc_types:
          type: array
          items: { type: string, enum: [nfe, nfce, cte, mdfe] }
        nat_op: { type: [string, 'null'], maxLength: 60 }
        tp_nf: { type: [string, 'null'], enum: ['0', '1', null] }
        fin_nfe: { type: [string, 'null'], enum: ['1', '2', '3', '4', null] }
        ind_final: { type: [string, 'null'], enum: ['0', '1', null] }
        ind_pres: { type: [string, 'null'], enum: ['0', '1', '2', '3', '4', '5', '9', null] }
        cfop_suffix:
          type: [string, 'null']
          pattern: '^\d{3}$'
          description: |
            Natureza fiscal (3 dígitos). O dígito de escopo (`5` intra-UF,
            `6` inter-UF, `7` exterior) é resolvido na emissão a partir das UFs
            de emitente e destinatário. Sem variante para o escopo exigido, a
            emissão é **bloqueada** com mensagem acionável — nada de sintetizar CFOP.
        tax_profile_id: { type: [string, 'null'] }
        payment_term_id: { type: [string, 'null'] }
        mod_frete: { type: [string, 'null'], enum: ['0', '1', '2', '3', '4', '9', null] }
        inf_ad_fisco:
          type: [string, 'null']
          maxLength: 2000
          description: |
            Aceita placeholders `{{chave}}`: `{{v_nf}}`, `{{v_icms_st}}`,
            `{{cliente}}`, `{{nat_op}}`, `{{competencia}}`. Chave desconhecida é
            erro de validação **no cadastro**, nunca interpolação em branco no XML.
        inf_cpl: { type: [string, 'null'], maxLength: 5000 }
        requires_receiver:
          type: [boolean, 'null']
          description: '`false` habilita emissão sem destinatário (self_issuance).'
        is_default:
          type: boolean
          description: |
            Operação pré-selecionada da organização. Só uma pode estar marcada:
            marcar uma desmarca a anterior no mesmo `TransactWrite`.

    OperationItem:
      type: object
      description: Natureza de operação persistida.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string, description: Identificador da natureza de operação. }
        name: { type: string }
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PaymentTermBody:
      type: object
      description: |
        Condição de pagamento nomeada ("30/60/90", "à vista", "boleto 28 dias").
        Na emissão, `payment_term_id` + o total do documento expandem para
        `payments`, `cobr_fat` e `cobr_duplicatas`. **A última parcela absorve o
        resíduo de arredondamento**: a soma das duplicatas fecha com `vNF`
        centavo a centavo. Valores explícitos no request vencem a expansão.
      required: [name, payment_type, installments]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        payment_type:
          type: string
          description: Mesmo domínio de `NfePaymentItem.payment_type`.
        ind_pag:
          type: [string, 'null']
          enum: ['0', '1', null]
          description: |
            `0` à vista, `1` a prazo. Ausente, é derivado: uma parcela com
            vencimento imediato é à vista, qualquer outra coisa é a prazo.
        installments: { type: integer, minimum: 1, maximum: 120 }
        interval_days: { type: integer, minimum: 0, maximum: 365, description: Intervalo entre parcelas. }
        first_due_days: { type: integer, minimum: 0, maximum: 365, description: Dias até o primeiro vencimento. }
        card:
          type: [object, 'null']
          additionalProperties: true
          description: Mesmos campos de `NfePaymentItem.card`.

    PaymentTermItem:
      type: object
      description: Condição de pagamento persistida.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string }
        name: { type: string }
        payment_type: { type: string }
        installments: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VehicleSetBody:
      type: object
      description: |
        Composição veicular — trator, até 3 reboques e condutores escolhidos de
        uma vez ("Carreta 1 — ABC1D23"). Na emissão do MDF-e, `vehicle_set_id`
        expande para `vehicle`, `trailers`, `drivers`, `rntrc` e `ciot`, e
        **cada campo continua sobrescrevível individualmente no mesmo request** —
        trocar o motorista de um dia não exige criar outro conjunto.

        O trator tem que ter `role=tractor` e cada reboque `role=trailer`; a
        checagem acontece no cadastro, não na emissão.
      required: [name, tractor_sk]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        tractor_sk: { type: string, description: 'SK do veículo de tração (role=tractor).' }
        trailer_sks:
          type: array
          maxItems: 3
          items: { type: string }
          description: 'SKs dos reboques (role=trailer).'
        driver_docs:
          type: array
          items: { $ref: '#/components/schemas/Cpf' }
          description: CPFs de pessoas do cadastro, tipicamente com o papel `driver`.
        rntrc: { type: [string, 'null'] }
        ciot: { type: [string, 'null'] }

    VehicleSetItem:
      type: object
      description: Composição veicular persistida.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string }
        name: { type: string }
        tractor_sk: { type: string }
        trailer_sks: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
