# Cadastros reutilizáveis — as decisões que antes eram redigitadas a cada
# emissão, guardadas uma vez e referenciadas por id.
#
# Todos compartilham a mesma forma (pk = organização, sk = {PREFIXO}_{uuid},
# GSI `name-index`), então compartilham também o mesmo conjunto de rotas.

paths:

  # ── Perfis fiscais ─────────────────────────────────────────────────────────

  /v1.0/tax-profiles:
    get:
      tags: [ TaxProfiles ]
      summary: Lista perfis fiscais
      operationId: listTaxProfiles
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/RegistryName'
      responses:
        '200':
          description: Página de perfis fiscais
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TaxProfileItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [ TaxProfiles ]
      summary: Cria um perfil fiscal
      operationId: createTaxProfile
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxProfileBody' }
      responses:
        '201':
          description: Perfil fiscal criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxProfileItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/tax-profiles/{tax_profile_id}:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - name: tax_profile_id
        in: path
        required: true
        description: Identificador do perfil (SK da linha).
        schema: { type: string }
    get:
      tags: [ TaxProfiles ]
      summary: Detalha um perfil fiscal
      operationId: getTaxProfile
      responses:
        '200':
          description: Perfil fiscal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxProfileItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [ TaxProfiles ]
      summary: Atualiza um perfil fiscal
      operationId: updateTaxProfile
      description: |
        Editar um perfil muda a tributação de **toda** emissão futura dos
        produtos que o referenciam. Documentos já emitidos não são afetados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxProfileBody' }
      responses:
        '200':
          description: Perfil fiscal atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxProfileItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [ TaxProfiles ]
      summary: Remove um perfil fiscal
      operationId: deleteTaxProfile
      responses:
        '204':
          description: Perfil fiscal removido
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Tabela de alíquotas ─────────────────────────────────────────────────────

  /v1.0/tax-tables/icms-aliq:
    get:
      tags: [ TaxProfiles ]
      summary: Consulta a alíquota ICMS/FCP que o sistema resolveria
      operationId: previewIcmsAliq
      description: |
        Devolve a alíquota ICMS/FCP que a emissão resolveria para
        emit_uf/dest_uf/ncm, sem nenhum override — usada pelo frontend para
        avisar quando um override customizado diverge da tabela padrão.
      parameters:
        - name: emit_uf
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 2 }
        - name: dest_uf
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 2 }
        - name: ncm
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Alíquotas resolvidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  icms_aliq: { type: string, example: "18.00" }
                  fcp_aliq: { type: string, example: "2.00" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

