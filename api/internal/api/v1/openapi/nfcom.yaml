paths:

  # ── NFCom ──────────────────────────────────────────────────────────────────

  /v1.0/nfcoms:
    post:
      tags: [ NFCom ]
      summary: Emite uma NFCom
      description: |
        Nota Fiscal Fatura de Serviço de Comunicação Eletrônica (modelo 62). A autorização é síncrona
        (`NFComRecepcao`, sem lote) e passa pelo outbox: a resposta é 201 com a nota `pending` e o resultado chega
        por WebSocket e por webhook (`document_type` `nfcom`).

        O servidor monta o documento: chave de acesso (com `nSiteAutoriz` 0), `vProd` de cada item
        (`quantity x unit_value - discount + other_charges`), a base, a alíquota e o valor do ICMS, do PIS e da
        COFINS (base = valor do item) e os totais. Antes de reservar número e cota, o documento passa pelo portão do
        MOC: regra determinística violada (campos de contingência, composição do Id, DV da chave, DV de CNPJ ou
        CPF) ou schema fora do leiaute é 422 com `code` `fiscal_prevalidation`.

        Na contingência offline (`PUT /nfcom-emission`), a nota é assinada no egress, o QR Code leva `sign` e o
        documento fica pendente (`contingency_state=pending`) até o reenvio com a mesma chave.

        Fora da v1: substituição, ajuste e cofaturamento, faturamento centralizado, IBS/CBS, FUST, FUNTTEL,
        retenções e partilha do ICMS. A emissão é cobrada pelo medidor `nfcom`: plano sem `quota_nfcom` recebe 402.
      operationId: emitNfcom
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NfcomEmitBody' }
      responses:
        '201':
          description: NFCom registrada e enfileirada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NfcomDocument' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [ NFCom ]
      summary: Lista NFCom
      operationId: listNfcoms
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/FilterNumber'
        - $ref: '#/components/parameters/FilterYear'
        - $ref: '#/components/parameters/FilterMonth'
        - $ref: '#/components/parameters/FilterDay'
      responses:
        '200':
          description: Página de NFCom
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/NfcomDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1.0/nfcoms/{access_key}:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    get:
      tags: [ NFCom ]
      summary: Lê uma NFCom
      operationId: getNfcom
      responses:
        '200':
          description: A NFCom
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NfcomDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1.0/nfcoms/{access_key}/xml:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    get:
      tags: [ NFCom ]
      summary: Baixa o XML autorizado
      operationId: getNfcomXml
      responses:
        '200': { $ref: '#/components/responses/XmlDownload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1.0/nfcoms/{access_key}/danfecom:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    get:
      tags: [ NFCom ]
      summary: Baixa o DANFE-COM em PDF
      description: |
        Documento auxiliar da NFCom (MOC Anexo II), A4 retrato, de leiaute único: qualquer `format` devolve 400
        `invalid-document-format`. Nota em contingência offline pendente imprime "EMITIDO EM CONTINGÊNCIA Pendente de
        autorização" no lugar do protocolo.
      operationId: getNfcomDanfecom
      responses:
        '200': { $ref: '#/components/responses/CachedPdfDownload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1.0/nfcoms/{access_key}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ NFCom ]
      summary: Cancela uma NFCom (evento 110111)
      description: |
        `justification` de 15 a 255 caracteres. O prazo é do autorizador: NFCom autorizada há mais de 120 horas
        volta como rejeição 220 pelo evento, e a nota retorna a `authorized`. Só nota `authorized` aceita o evento.
      operationId: cancelNfcom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelEventBody' }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NfcomDocument' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/nfcoms/{access_key}/payment-link:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ NFCom ]
      summary: Vinculação de pagamento do NFCom (evento 110300)
      description: |
        Schema `evVincPgto` (NT 2026.001). Vale com o NFCom autorizado; o protocolo vem do documento. `sequence_number` vazio usa o
        próximo número (cada vinculação tem o seu). Autor, autorizador e prazo não constam de documento do repositório: a api não
        restringe o autor (o autorizador confere).
      operationId: registerNfcomPaymentLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ number, transaction_id, payment_method, receiver_cnpj, psp_base_cnpj ]
              properties:
                number: { type: integer, minimum: 1, maximum: 990, description: nPag }
                transaction_id: { type: string, minLength: 2, maxLength: 35, description: idTransacao }
                payment_method: { type: string, pattern: '^[0-9]{2}$', description: tpMeioPgto }
                receiver_cnpj: { type: string, minLength: 14, maxLength: 14, description: CNPJReceb }
                psp_base_cnpj: { type: string, minLength: 8, maxLength: 8, description: CNPJBasePSP }
                sequence_number: { type: integer, minimum: 1, maximum: 20 }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NfcomDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/nfcoms/{access_key}/payment-link-cancel:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ NFCom ]
      summary: Cancela a vinculação de pagamento (evento 110301)
      description: |
        Schema `evCancVincPgto`. O 110300 a cancelar é escolhido por `event_sk` (precisa estar `success`, com protocolo de 16 dígitos); o protocolo dele vem do registro.
      operationId: cancelNfcomPaymentLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ event_sk ]
              properties:
                event_sk: { type: string }
                sequence_number: { type: integer, minimum: 1, maximum: 20 }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NfcomDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/nfcoms/{access_key}/events:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    get:
      tags: [ NFCom ]
      summary: Lista os eventos de uma NFCom
      operationId: listNfcomEvents
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de eventos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/DocumentEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1.0/nfcoms/{access_key}/events/{event_sk}/xml:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
      - $ref: '#/components/parameters/EventSk'
    get:
      tags: [ NFCom ]
      summary: Baixa o XML de um evento
      operationId: getNfcomEventXml
      responses:
        '200': { $ref: '#/components/responses/XmlDownload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  schemas:

    NfcomDocument:
      allOf:
        - $ref: '#/components/schemas/FiscalDocument'
        - type: object
          properties:
            customer_name: { type: string }
            customer_doc: { type: string, description: CNPJ ou CPF do cliente, só dígitos (CNPJ alfanumérico aceito). }
            subscriber_code: { type: string }
            total: { type: string, description: 'Valor total da NFCom (`vNF`), duas casas.' }
            items: { type: integer, description: Quantidade de itens. }

    NfcomEmitBody:
      type: object
      description: |
        Corpo da emissão: o assinante e os planos por id, mais o que muda a cada fatura. Cliente, endereço, IE,
        classificação, unidade e tributos vêm dos cadastros (assinante, pessoa e plano).
      required: [ subscriber_id, items ]
      properties:
        subscriber_id: { type: string, pattern: '^[A-Za-z0-9._/-]{1,60}$', description: 'Id do assinante (`/nfcom-subscribers`).' }
        items:
          type: array
          minItems: 1
          maxItems: 990
          items: { $ref: '#/components/schemas/NfcomItemRequest' }
        invoice: { $ref: '#/components/schemas/NfcomInvoice' }
        prepaid:
          type: boolean
          description: Serviço pré-pago (`indPrePago`); dispensa a fatura.
        additional_info: { type: string, maxLength: 3000, description: 'Texto livre; espaços normalizados, sem `<` nem `>`, só caracteres até U+00FF.' }
        authorized_xml:
          type: array
          maxItems: 10
          items: { type: string, description: CNPJ ou CPF autorizado a baixar o XML. }
        contingency_reason:
          type: string
          minLength: 15
          maxLength: 256
          description: Justificativa (`xJust`) na contingência offline; sem ela vale a registrada no `PUT /nfcom-emission`.

    NfcomItemRequest:
      type: object
      required: [ plan_id, quantity ]
      properties:
        plan_id: { type: string, pattern: '^[A-Za-z0-9._/-]{1,60}$', description: 'Id do plano (`/nfcom-plans`).' }
        quantity: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$', description: Decimal positivo. }
        unit_value: { type: string, description: Só quando o plano não tem valor padrão; com valor fixo no plano é recusado. }
        discount: { type: string, description: Decimal não negativo. }
        other_charges: { type: string, description: Decimal não negativo. }

    NfcomInvoice:
      type: object
      required: [ competence, due_date, bar_code ]
      properties:
        competence: { type: string, pattern: '^[0-9]{6}$', description: AAAAMM. }
        due_date: { type: string, format: date }
        bar_code: { type: string, pattern: '^[0-9]{1,48}$' }
