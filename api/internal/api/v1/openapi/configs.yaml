paths:

  # ── Fiscal configs ─────────────────────────────────────────────────────────

  /v1.0/organizations/{org_pk}/nfe-emission:
    parameters:
      - $ref: '#/components/parameters/OrgPk'
    put:
      tags: [ Fiscal Configs ]
      summary: Define a forma de emissão corrente da NF-e e a contingência automática
      description: |
        Tipos válidos para este documento: `normal`, `svc` (SVC-AN ou SVC-RS pela UF do emitente, `tpEmis` 6 ou 7) e `epec` (`tpEmis` 4). Qualquer outro devolve 422
        `emission_type_invalid`. Sair de `normal` exige `justification` (15 a 256 caracteres,
        vira `xJust`; 422 `emission_reason_required`) e grava `contingency_since` (`dhCont`),
        mantido enquanto a empresa continua em contingência; ao voltar a `normal` o
        `contingency_since` e a justificativa são removidos. `auto_contingency` (padrão
        desligado) autoriza o sistema a trocar sozinho a forma de emissão quando o
        autorizador está indisponível, regerando o documento. O `PUT /nfe-config` nunca
        altera estes campos. O GET da configuração devolve `emission_type`,
        `auto_contingency`, `contingency_since` e `emission_options` (a lista dos tipos válidos).
      operationId: putNFeEmission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmissionBody' }
      responses:
        '200': { $ref: '#/components/responses/FiscalConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/organizations/{org_pk}/nfce-emission:
    parameters:
      - $ref: '#/components/parameters/OrgPk'
    put:
      tags: [ Fiscal Configs ]
      summary: Define a forma de emissão corrente da NFC-e e a contingência automática
      description: |
        Tipos válidos para este documento: `normal`, `offline` (`tpEmis` 9, todas as UFs) e `epec` (`tpEmis` 4, a critério da UF). Qualquer outro devolve 422
        `emission_type_invalid`. Sair de `normal` exige `justification` (15 a 256 caracteres,
        vira `xJust`; 422 `emission_reason_required`) e grava `contingency_since` (`dhCont`),
        mantido enquanto a empresa continua em contingência; ao voltar a `normal` o
        `contingency_since` e a justificativa são removidos. `auto_contingency` (padrão
        desligado) autoriza o sistema a trocar sozinho a forma de emissão quando o
        autorizador está indisponível, regerando o documento. O `PUT /nfce-config` nunca
        altera estes campos. O GET da configuração devolve `emission_type`,
        `auto_contingency`, `contingency_since` e `emission_options` (a lista dos tipos válidos).
      operationId: putNFCeEmission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmissionBody' }
      responses:
        '200': { $ref: '#/components/responses/FiscalConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/organizations/{org_pk}/cte-emission:
    parameters:
      - $ref: '#/components/parameters/OrgPk'
    put:
      tags: [ Fiscal Configs ]
      summary: Define a forma de emissão corrente da CT-e e a contingência automática
      description: |
        Tipos válidos para este documento: `normal`, `offline` (`tpEmis` 2) e `svc` (SVC-RS ou SVC-SP pela UF do emitente, `tpEmis` 7 ou 8); sem EPEC. Qualquer outro devolve 422
        `emission_type_invalid`. Sair de `normal` exige `justification` (15 a 256 caracteres,
        vira `xJust`; 422 `emission_reason_required`) e grava `contingency_since` (`dhCont`),
        mantido enquanto a empresa continua em contingência; ao voltar a `normal` o
        `contingency_since` e a justificativa são removidos. `auto_contingency` (padrão
        desligado) autoriza o sistema a trocar sozinho a forma de emissão quando o
        autorizador está indisponível, regerando o documento. O `PUT /cte-config` nunca
        altera estes campos. O GET da configuração devolve `emission_type`,
        `auto_contingency`, `contingency_since` e `emission_options` (a lista dos tipos válidos).
      operationId: putCTeEmission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmissionBody' }
      responses:
        '200': { $ref: '#/components/responses/FiscalConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/organizations/{org_pk}/mdfe-emission:
    parameters:
      - $ref: '#/components/parameters/OrgPk'
    put:
      tags: [ Fiscal Configs ]
      summary: Define a forma de emissão corrente da MDF-e e a contingência automática
      description: |
        Tipos válidos para este documento: `normal` e `offline` (`tpEmis` 2); sem SVC e sem EPEC. Qualquer outro devolve 422
        `emission_type_invalid`. Sair de `normal` exige `justification` (15 a 256 caracteres,
        vira `xJust`; 422 `emission_reason_required`) e grava `contingency_since` (`dhCont`),
        mantido enquanto a empresa continua em contingência; ao voltar a `normal` o
        `contingency_since` e a justificativa são removidos. `auto_contingency` (padrão
        desligado) autoriza o sistema a trocar sozinho a forma de emissão quando o
        autorizador está indisponível, regerando o documento. O `PUT /mdfe-config` nunca
        altera estes campos. O GET da configuração devolve `emission_type`,
        `auto_contingency`, `contingency_since` e `emission_options` (a lista dos tipos válidos).
      operationId: putMDFeEmission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmissionBody' }
      responses:
        '200': { $ref: '#/components/responses/FiscalConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/organizations/{org_pk}/nfe-contingency:
    parameters:
      - $ref: '#/components/parameters/OrgPk'
    put:
      tags: [ Fiscal Configs ]
      summary: Abre ou fecha a janela de contingência SVC da NF-e (legado)
      deprecated: true
      description: |
        Legado: use `PUT /nfe-emission`. `enabled` equivale a `emission_type` `svc`; desligar, a `normal`.
        Com a janela aberta, as NF-e novas saem com `tpEmis` 6 (SVC-AN) ou 7 (SVC-RS),
        conforme a UF do emitente, e `dhCont`/`xJust` preenchidos. O cancelamento de uma
        nota autorizada na SVC vai à mesma SVC. NFC-e não usa SVC. Abrir uma janela já
        aberta mantém a data e a justificativa originais. O `PUT /nfe-config` nunca
        altera a janela. A resposta é a configuração, com `contingency_mode`
        (`svc`), `contingency_since` e `contingency_reason` enquanto aberta.
      operationId: putNfeContingency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NfeContingencyBody' }
      responses:
        '200': { $ref: '#/components/responses/FiscalConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/organizations/{org_pk}/nfe-config:
    parameters:
      - $ref: '#/components/parameters/OrgPk'
    get:
      tags: [ Fiscal Configs ]
      summary: Lê a configuração de NF-e
      operationId: getNfeConfig
      responses:
        '200': { $ref: '#/components/responses/FiscalConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [ Fiscal Configs ]
      summary: Grava a configuração de NF-e
      description: |
        Série e numeração são mantidas por ambiente (`prod_*` / `hom_*`).
        Reduzir `*_current_number` reemite números já usados e provoca rejeição
        na SEFAZ — só faça isso ao migrar de outro emissor.
      operationId: putNfeConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FiscalConfigBody' }
      responses:
        '200': { $ref: '#/components/responses/FiscalConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/organizations/{org_pk}/nfce-config:
    parameters:
      - $ref: '#/components/parameters/OrgPk'
    get:
      tags: [ Fiscal Configs ]
      summary: Lê a configuração de NFC-e
      operationId: getNfceConfig
      responses:
        '200': { $ref: '#/components/responses/FiscalConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [ Fiscal Configs ]
      summary: Grava a configuração de NFC-e
      description: |
        Além da série/numeração, com `qr_code_version` 2 (padrão) exige o CSC
        (Código de Segurança do Contribuinte) e seu identificador por ambiente;
        sem eles o QR Code não pode ser gerado. Com `qr_code_version` 3 (NT
        2025.001) o QR Code não usa CSC e os campos de CSC são opcionais.
      operationId: putNfceConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NfceConfigBody' }
      responses:
        '200': { $ref: '#/components/responses/FiscalConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/organizations/{org_pk}/cte-config:
    parameters:
      - $ref: '#/components/parameters/OrgPk'
    get:
      tags: [ Fiscal Configs ]
      summary: Lê a configuração de CT-e
      operationId: getCteConfig
      responses:
        '200': { $ref: '#/components/responses/FiscalConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [ Fiscal Configs ]
      summary: Grava a configuração de CT-e
      operationId: putCteConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FiscalConfigBody' }
      responses:
        '200': { $ref: '#/components/responses/FiscalConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/organizations/{org_pk}/mdfe-config:
    parameters:
      - $ref: '#/components/parameters/OrgPk'
    get:
      tags: [ Fiscal Configs ]
      summary: Lê a configuração de MDF-e
      operationId: getMdfeConfig
      responses:
        '200': { $ref: '#/components/responses/FiscalConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [ Fiscal Configs ]
      summary: Grava a configuração de MDF-e
      operationId: putMdfeConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MdfeConfigBody' }
      responses:
        '200': { $ref: '#/components/responses/FiscalConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/organizations/{org_pk}/nfse-config:
    parameters:
      - $ref: '#/components/parameters/OrgPk'
    get:
      tags: [ Fiscal Configs ]
      summary: Lê a configuração de NFS-e
      operationId: getNfseConfig
      responses:
        '200': { $ref: '#/components/responses/FiscalConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [ Fiscal Configs ]
      summary: Grava a configuração de NFS-e
      description: |
        Diferente dos demais: a NFS-e tem uma única `serie` (não uma por
        ambiente). O `timezone` define o offset de `dhEmi` na DPS.

        A inscrição municipal e o regime tributário **não** ficam aqui: vêm do
        grupo `nfse` do objeto `person` da organização, porque quando ela emite
        como tomador ou intermediário o prestador é outra pessoa.
      operationId: putNfseConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NfseConfigBody' }
      responses:
        '200': { $ref: '#/components/responses/FiscalConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:

  schemas:

    # -- Configurações fiscais ---------------------------------------------

    FiscalConfig:
      type: object
      description: Configuração fiscal persistida (formato varia por tipo de documento).
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string }
        environment:
          type: integer
          enum: [ 1, 2 ]
          description: '`1` produção · `2` homologação.'
        updated_at: { type: string, format: date-time }

    MdfeConfigBody:
      type: object
      description: |
        Configuração de MDF-e. É a `FiscalConfigBody` mais os campos do transporte que
        recorrem em toda emissão da organização (o RNTRC também serve ao CT-e).
      allOf:
        - $ref: '#/components/schemas/FiscalConfigBody'
        - type: object
          properties:
            ind_canal_verde:
              type: boolean
              description: Participação no Canal Verde → `ide/indCanalVerde` (`1` quando ligado).
            ind_carrega_posterior:
              type: boolean
              description: |
                Padrão do carregamento posterior (`ide/indCarregaPosterior`): vale só para emissão sem
                documentos e sem `later_loading` no pedido (com documentos a SEFAZ rejeita, F27).
            inf_ad_fisco:
              type: [ string, 'null' ]
              maxLength: 2000
              description: |
                Mensagem de interesse do fisco repetida em toda emissão →
                `infAdic/infAdFisco`. A observação da viagem continua em
                `additional_info`, no corpo da emissão.
            rntrc:
              type: [ string, 'null' ]
              pattern: '^\d{8}$'
              description: |
                RNTRC da transportadora (ANTT). O CT-e rodoviário o usa em `infModal/rodo/RNTRC`;
                sem ele a emissão de CT-e devolve 422 `rntrc_required`.

    EmissionBody:
      type: object
      required: [ emission_type ]
      properties:
        emission_type: { type: string, enum: [ normal, svc, epec, offline ] }
        auto_contingency: { type: boolean, default: false }
        justification:
          type: string
          minLength: 15
          maxLength: 256
          description: Obrigatória ao sair de `normal` (`ide/xJust`).

    NfeContingencyBody:
      type: object
      required: [ enabled ]
      properties:
        enabled: { type: boolean }
        justification:
          type: string
          minLength: 15
          maxLength: 256
          description: Obrigatória ao abrir (`ide/xJust`).

    FiscalConfigBody:
      type: object
      description: Configuração de NF-e e CT-e (o MDF-e usa `MdfeConfigBody`).
      required: [ timezone, environment ]
      properties:
        timezone: { $ref: '#/components/schemas/Timezone' }
        environment:
          type: integer
          enum: [ 1, 2 ]
          description: '`1` produção · `2` homologação.'
        prod_current_serie: { type: integer, minimum: 0 }
        prod_current_number:
          type: integer
          minimum: 0
          description: Último número emitido em produção. Reduzi-lo reemite números já usados.
        hom_current_serie: { type: integer, minimum: 0 }
        hom_current_number: { type: integer, minimum: 0 }
        csrt_id:
          type: [ string, 'null' ]
          maxLength: 2
          description: Identificador do CSRT (NT 2018.005). Não é segredo — o XML o carrega em claro.
        csrt:
          type: [ string, 'null' ]
          minLength: 36
          maxLength: 36
          description: |
            Código de Segurança do Responsável Técnico. **Write-only**: nunca
            aparece numa resposta, nem neste PUT. Omiti-lo mantém o valor
            gravado; só um valor novo o substitui. O que vai no XML é
            `hashCSRT = Base64(SHA1(CSRT + chave de acesso))`.

    NfceConfigBody:
      type: object
      required: [ timezone, environment ]
      description: |
        Configuração de NFC-e. Com `qr_code_version` 2 (ou ausente) os quatro campos de CSC
        são obrigatórios; com 3 são opcionais.
      properties:
        timezone: { $ref: '#/components/schemas/Timezone' }
        environment: { type: integer, enum: [ 1, 2 ] }
        qr_code_version:
          type: integer
          enum: [ 2, 3 ]
          default: 2
          description: |
            Versão do QR Code da NFC-e. A 3 (NT 2025.001) dispensa CSC, hash e assinatura no
            QR online; a UF pode ainda não aceitar (rejeição 407). Emitente CPF (produtor
            rural) exige a 3, exceto PR (rejeição 444).
        prod_current_serie: { type: integer, minimum: 0 }
        prod_current_number: { type: integer, minimum: 0 }
        hom_current_serie: { type: integer, minimum: 0 }
        hom_current_number: { type: integer, minimum: 0 }
        prod_csc:
          type: string
          maxLength: 36
          description: |
            Código de Segurança do Contribuinte de produção, usado no QR Code.
            **Write-only**, pelas mesmas regras de `csrt`.
        prod_csc_id: { type: integer, minimum: 1 }
        hom_csc: { type: string, maxLength: 36 }
        hom_csc_id: { type: integer, minimum: 1 }
        csrt_id:
          type: [ string, 'null' ]
          maxLength: 2
          description: Identificador do CSRT (NT 2018.005). Não é segredo — o XML o carrega em claro.
        csrt:
          type: [ string, 'null' ]
          minLength: 36
          maxLength: 36
          description: |
            Código de Segurança do Responsável Técnico. **Write-only**: nunca
            aparece numa resposta, nem neste PUT. Omiti-lo mantém o valor
            gravado; só um valor novo o substitui. O que vai no XML é
            `hashCSRT = Base64(SHA1(CSRT + chave de acesso))`.

    NfseAbrasfBody:
      type: object
      description: Configuração específica do provider `abrasf204`.
      required: [ endpoint_url, wsdl_version, municipality_code ]
      properties:
        endpoint_url: { type: string, format: uri }
        wsdl_version: { type: string, maxLength: 10 }
        municipality_code: { $ref: '#/components/schemas/Ibge' }
        synchronous:
          type: boolean
          description: Indica se o município responde a emissão de forma síncrona.

    NfseConfigBody:
      type: object
      description: |
        Configuração de NFS-e. Série única (não por ambiente); o `timezone`
        define o offset usado em `dhEmi`.
      required: [ provider, environment, timezone, c_loc_emi, serie ]
      properties:
        provider:
          type: string
          enum: [ nacional, abrasf204 ]
          description: '`nacional` fala com o ADN; `abrasf204` com o webservice do município.'
        environment: { type: integer, enum: [ 1, 2 ] }
        timezone: { $ref: '#/components/schemas/Timezone' }
        c_loc_emi:
          allOf: [ { $ref: '#/components/schemas/Ibge' } ]
          description: Município de emissão (do prestador).
        serie: { type: string, maxLength: 5, pattern: '^\d+$' }
        prod_current_number: { type: integer, minimum: 0 }
        hom_current_number: { type: integer, minimum: 0 }
        certificate_sk: { type: [ string, 'null' ], maxLength: 60 }
        abrasf: { $ref: '#/components/schemas/NfseAbrasfBody' }
