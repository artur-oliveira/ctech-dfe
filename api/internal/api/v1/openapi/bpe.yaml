paths:

  # ── BP-e ──────────────────────────────────────────────────────────────────

  /v1.0/bpes:
    post:
      tags: [ BP-e ]
      summary: Emite um BP-e (comum, TM ou TA)
      description: |
        Bilhete de Passagem Eletrônico (modelo 63) comum (rodoviário, aquaviário ou ferroviário) ou TM (transporte
        metropolitano, `tpBPe` 4, serviço `BPeRecepcaoTM`, credenciamento específico) ou TA (transporte aéreo, modal 2,
        só SVRS, credenciamento específico, só compra normal). Comum e TA usam o `BpeEmitBody` e o TM o `BpeTmEmitBody`: a venda
        aponta as linhas do cadastro (`/bpe-lines`) por id e informa só o que varia; o TA usa IBS/CBS no lugar do ICMS e o servidor calcula `vTotDFe`. A autorização é síncrona (`BPeRecepcao`, sem lote) e passa pelo outbox: a
        resposta é 201 com o bilhete `pending` e o resultado chega por WebSocket e por webhook (`document_type` `bpe`).

        O servidor monta o documento: chave de acesso, `vBP` (soma dos componentes), `vPgto` (`vBP` menos o desconto),
        `vTroco` (o que os pagamentos passam de `vPgto`) e o ICMS (base = `vPgto`). Antes de reservar número e cota, o
        documento passa pelo portão do MOC: regra determinística violada (campos de contingência, composição do Id, DV da
        chave, DV de CPF ou CNPJ) ou schema fora do leiaute é 422 com `code` `fiscal_prevalidation`.

        Na contingência offline (`PUT /bpe-emission`), o bilhete é assinado no egress, o QR Code leva `sign` e o documento
        fica pendente (`contingency_state=pending`) até o reenvio com a mesma chave.

        Substituição (`substitution`, `tpBPe` 3): o bilhete original precisa ser da organização, estar autorizado, ser da mesma
        variante (comum com comum, TA com TA), repetir UF, município e comprador e, se o embarque já passou, ter o evento de não
        embarque; senão 422. Autorizado o substituto, o original passa a `substituted`. Agência (`agency`) imprime a Divisão I do
        DABPE e `board_pass` (só no comum) o PDF417 da Divisão IX. No TA, `purchase_type` escolhe compra normal, BP-e múltiplo
        (fretamento, sem passageiro e com comprador) ou vinculado a um múltiplo (`multiple_key`, sem valores, imposto nem pagamento).

        Fora desta versão: ICMS 20 e partilha (o TA usa IBS/CBS, sem regras F76 a F111) e o evento de ajuste 112130 do TA (a NT
        o deixa sem especificação). A emissão é cobrada pelo medidor `bpe`: plano sem `quota_bpe` recebe 402.
      operationId: emitBpe
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/BpeEmitBody'
                - $ref: '#/components/schemas/BpeTmEmitBody'
              description: '`variant` escolhe o corpo: `normal` (padrão) e `ta` usam `BpeEmitBody`; `tm` usa `BpeTmEmitBody`.'

      responses:
        '201':
          description: BP-e registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BpeDocument' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [ BP-e ]
      summary: Lista BP-e
      operationId: listBpes
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/FilterNumber'
        - $ref: '#/components/parameters/FilterYear'
        - $ref: '#/components/parameters/FilterMonth'
        - $ref: '#/components/parameters/FilterDay'
      responses:
        '200':
          description: Página de BP-e
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/BpeDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1.0/bpes/{access_key}:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    get:
      tags: [ BP-e ]
      summary: Lê um BP-e
      operationId: getBpe
      responses:
        '200':
          description: O BP-e
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BpeDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1.0/bpes/{access_key}/xml:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    get:
      tags: [ BP-e ]
      summary: Baixa o XML autorizado
      operationId: getBpeXml
      responses:
        '200': { $ref: '#/components/responses/XmlDownload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1.0/bpes/{access_key}/dabpe:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    get:
      tags: [ BP-e ]
      summary: Baixa o DABPE em PDF
      description: |
        Documento auxiliar do BP-e (MOC Anexo II). Vale para o BP-e comum e o TA; o TM não tem bilhete individual e devolve 400.
        Bilhete em contingência offline pendente imprime "EMITIDO EM CONTINGÊNCIA Pendente de autorização" no lugar do
        protocolo e sai com duas vias (a segunda, "Via do Estabelecimento").
      operationId: getBpeDabpe
      parameters:
        - name: format
          in: query
          required: false
          description: "Formato impresso. Vazio ou retrato: A4. reduzido: bobina de 58 mm (o MOC pede no mínimo 56 mm). Valor fora da lista: 400 invalid-document-format."
          schema: { type: string, enum: [ retrato, reduzido ] }
      responses:
        '200': { $ref: '#/components/responses/CachedPdfDownload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1.0/bpes/{access_key}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ BP-e ]
      summary: Cancela um BP-e (evento 110111)
      description: |
        `justification` de 15 a 255 caracteres. Os prazos são do autorizador: antes do embarque, e com um evento de não
        embarque registrado o cancelamento é recusado (rejeição 504); o evento rejeitado devolve o bilhete a `authorized`.
        Só bilhete `authorized` aceita o evento.
      operationId: cancelBpe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelEventBody' }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BpeDocument' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/bpes/{access_key}/no-show:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ BP-e ]
      summary: Registra o não embarque (evento 110115)
      description: |
        `justification` de 15 a 255 caracteres. O prazo (até 24 horas depois do embarque) e a exclusão com cancelamento são
        do autorizador. Não vale para o TM.
      operationId: noShowBpe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelEventBody' }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BpeDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/bpes/{access_key}/seat-change:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ BP-e ]
      summary: Altera a poltrona (evento 110116)
      description: Troca a poltrona sem alterar valor nem data de embarque. Não vale para o TA.
      operationId: seatChangeBpe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ seat ]
              properties:
                seat: { type: string, maxLength: 3, pattern: '^[0-9]{1,3}$' }
                sequence_number: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BpeDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/bpes/{access_key}/excess-baggage:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ BP-e ]
      summary: Registra o excesso de bagagem (evento 110117)
      description: Só vale para o BP-e comum (não para o TM nem para o TA). `quantity` é o texto do leiaute (até 20 caracteres).
      operationId: excessBaggageBpe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ quantity, value ]
              properties:
                quantity: { type: string, minLength: 1, maxLength: 20 }
                value: { type: string, description: Valor total cobrado, decimal não negativo. }
                sequence_number: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BpeDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/bpes/{access_key}/supply-not-performed:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ BP-e ]
      summary: Registra o fornecimento não realizado (evento 112140)
      description: Só vale para o TA com pagamento antecipado. Informa o IBS e a CBS do serviço não fornecido.
      operationId: supplyNotPerformedBpe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ ibs_value, cbs_value ]
              properties:
                ibs_value: { type: string, description: Decimal não negativo. }
                cbs_value: { type: string, description: Decimal não negativo. }
                sequence_number: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BpeDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/bpes/{access_key}/payment-link:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ BP-e ]
      summary: Vinculação de pagamento do BP-e (comum, TM e TA) (evento 110300)
      description: |
        Schema `evVincPgto` (NT 2026.001). Vale com o BP-e (comum, TM e TA) autorizado; o protocolo vem do documento. `sequence_number` vazio usa o
        próximo número (cada vinculação tem o seu). Autor, autorizador e prazo não constam de documento do repositório: a api não
        restringe o autor (o autorizador confere).
      operationId: registerBpePaymentLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ number, transaction_id, payment_method, receiver_cnpj, psp_base_cnpj ]
              properties:
                number: { type: integer, minimum: 1, maximum: 990, description: nPag }
                transaction_id: { type: string, minLength: 2, maxLength: 35, description: idTransacao }
                payment_method: { type: string, pattern: '^[0-9]{2}$', description: tpMeioPgto }
                receiver_cnpj: { type: string, minLength: 14, maxLength: 14, description: CNPJReceb }
                psp_base_cnpj: { type: string, minLength: 8, maxLength: 8, description: CNPJBasePSP }
                sequence_number: { type: integer, minimum: 1, maximum: 20 }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BpeDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/bpes/{access_key}/payment-link-cancel:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    post:
      tags: [ BP-e ]
      summary: Cancela a vinculação de pagamento (evento 110301)
      description: |
        Schema `evCancVincPgto`. O 110300 a cancelar é escolhido por `event_sk` (precisa estar `success`, com protocolo de 15 dígitos); o protocolo dele vem do registro.
      operationId: cancelBpePaymentLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ event_sk ]
              properties:
                event_sk: { type: string }
                sequence_number: { type: integer, minimum: 1, maximum: 20 }
      responses:
        '200':
          description: Evento registrado e enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BpeDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1.0/bpes/{access_key}/events:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
    get:
      tags: [ BP-e ]
      summary: Lista os eventos de um BP-e
      operationId: listBpeEvents
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de eventos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/DocumentEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1.0/bpes/{access_key}/events/{event_sk}/xml:
    parameters:
      - $ref: '#/components/parameters/OrgHeader'
      - $ref: '#/components/parameters/AccessKey'
      - $ref: '#/components/parameters/EventSk'
    get:
      tags: [ BP-e ]
      summary: Baixa o XML de um evento
      operationId: getBpeEventXml
      responses:
        '200': { $ref: '#/components/responses/XmlDownload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  schemas:

    BpeDocument:
      allOf:
        - $ref: '#/components/schemas/FiscalDocument'
        - type: object
          properties:
            variant: { type: string, enum: [ normal, tm, ta ] }
            modal: { type: string, enum: [ rodoviario, aquaviario, ferroviario ] }
            passenger_name: { type: string }
            from_name: { type: string }
            to_name: { type: string }
            boarding: { type: string, format: date-time }
            total: { type: string, description: 'Valor total do bilhete (`vBP`), duas casas.' }
            trips: { type: integer, description: Quantidade de trechos (comum). }
            competence: { type: string, format: date, description: Competência (TM). }
            passengers: { type: string, description: Total de passageiros (TM). }
            groups: { type: integer, description: Grupos de viagem (TM). }
            items: { type: integer, description: Itens (TM). }

    BpeEmitBody:
      type: object
      description: |
        Venda do bilhete comum (`variant` `normal`, o padrão) ou do TA (`variant` `ta`). A linha de cada trecho vem do
        cadastro (`/bpe-lines`): percurso, serviço, acomodação, prefixo, locais e imposto (ICMS no comum, IBS/CBS no TA). A
        venda informa data e hora, poltrona, valores, pagamento e o passageiro. O passageiro avulso (nome e documento direto)
        é o caminho principal; `passenger_person_id` usa uma pessoa física do cadastro (o CPF vai como documento). Comprador e
        agência são pessoas do cadastro (`buyer_person_id`, `agency_person_id`; a agência é pessoa jurídica).
      required: [ presence, trips, boarding, validity ]
      properties:
        variant: { type: string, enum: [ normal, ta ], description: 'Padrão `normal`; as linhas de todos os trechos devem ser dessa variante.' }
        presence: { type: string, enum: [ '1', '2', '3', '4', '5', '9' ], description: '`indPres`: 1 presencial, 2 internet, 3 teleatendimento, 4 entrega em domicílio, 5 presencial fora do estabelecimento, 9 outros.' }
        trips:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/BpeTripRequest' }
        boarding: { type: string, format: date-time, description: Embarque (`dhEmb`), com fuso. }
        validity: { type: string, format: date-time, description: Validade (`dhValidade`), não anterior ao embarque. }
        passenger: { $ref: '#/components/schemas/BpePassenger' }
        passenger_person_id: { type: string, pattern: '^[A-Za-z0-9._/-]{1,60}$', description: 'Pessoa física do cadastro (`CPF_...`) como passageiro; exclui `passenger`.' }
        buyer_person_id: { type: string, pattern: '^[A-Za-z0-9._/-]{1,60}$', description: Comprador (pessoa do cadastro com endereço completo). }
        agency_person_id: { type: string, pattern: '^[A-Za-z0-9._/-]{1,60}$', description: Agência (pessoa jurídica do cadastro com endereço completo). }
        purchase_type: { type: string, enum: [ normal, multiple, linked ], description: 'Só no TA: compra normal, BP-e múltiplo (fretamento, sem passageiro e com comprador) ou vinculado a um múltiplo (`multiple_key`, sem valores, imposto nem pagamento).' }
        multiple_key: { type: string, minLength: 44, maxLength: 44 }
        iata_number: { type: string, pattern: '^[A-Za-z0-9._/-]{1,20}$', description: Só no TA; número do bilhete na IATA. }
        substitution: { $ref: '#/components/schemas/BpeSubstitution' }
        components:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [ type, value ]
            properties:
              type: { type: string, enum: [ '01', '02', '03', '04', '05', '06', '07', '08', '99' ], description: '`tpComp`; no comum 01 a 06 e 99, no TA 01, 03, 06, 07, 08 e 99.' }
              value: { type: string, description: Decimal não negativo. }
        discount: { type: string, description: Decimal não negativo; com desconto maior que zero o tipo e a descrição são obrigatórios. }
        discount_type: { type: string, enum: [ '01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12', '13', '99' ], description: 'No TA valem 03, 09 a 13 e 99.' }
        discount_desc: { type: string, minLength: 2, maxLength: 100 }
        discount_code: { type: string, pattern: '^[A-Za-z0-9._/-]{1,20}$' }
        payments:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [ type, value ]
            properties:
              type: { type: string, enum: [ '01', '02', '03', '04', '05', '06', '99' ], description: '`tPag`: 01 dinheiro, 02 cheque, 03 cartão de crédito, 04 cartão de débito, 05 vale, 06 PIX, 99 outros.' }
              desc: { type: string, maxLength: 60 }
              doc: { type: string, maxLength: 20 }
              value: { type: string }
              card:
                type: object
                required: [ integration ]
                properties:
                  integration: { type: string, enum: [ '1', '2' ] }
                  cnpj: { type: string }
                  brand: { type: string, enum: [ '01', '02', '03', '04', '05', '06', '99' ] }
                  authorization: { type: string, maxLength: 20 }
        board_pass: { type: string, minLength: 50, maxLength: 1000, description: Só no comum; conteúdo do PDF417 do DABPE. }
        additional_info: { type: string, maxLength: 5000, description: 'Texto livre; espaços normalizados, sem `<` nem `>`, só caracteres até U+00FF.' }
        authorized_xml:
          type: array
          maxItems: 10
          items: { type: string }
        contingency_reason: { type: string, minLength: 15, maxLength: 256 }

    BpeTripRequest:
      type: object
      required: [ line_id, leg_type, departure ]
      properties:
        line_id: { type: string, pattern: '^[A-Za-z0-9._/-]{1,60}$', description: Id da linha (`/bpe-lines`). }
        leg_type: { type: string, enum: [ '1', '2', '3' ], description: '`tpTrecho`: 1 normal, 2 inicial, 3 conexão.' }
        departure: { type: string, format: date-time }
        connection: { type: string, format: date-time, description: Só no trecho de conexão (3), e obrigatória nele. }
        seat: { type: string, pattern: '^[0-9]{1,3}$', description: Só no comum. }
        platform: { type: string, pattern: '^[A-Za-z0-9._/-]{1,20}$', description: Só no comum. }
        crossing:
          type: object
          required: [ vehicle_type, vehicle_status ]
          properties:
            vehicle_type: { type: string, minLength: 2, maxLength: 2 }
            vehicle_status: { type: string, enum: [ '1', '2', '3' ] }

    BpePassenger:
      type: object
      required: [ name, doc_type, doc_number ]
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        cpf: { type: string }
        doc_type: { type: string, enum: [ '1', '2', '3', '4', '5' ], description: '`tpDoc`: 1 RG, 2 título de eleitor, 3 passaporte, 4 CNH, 5 outros.' }
        doc_number: { type: string, maxLength: 20 }
        doc_desc: { type: string, maxLength: 100 }
        birth: { type: string, format: date }
        phone: { type: string }
        email: { type: string, format: email }

    BpeTmEmitBody:
      type: object
      description: |
        BP-e TM (`variant` `tm`): apuração por grupo de viagem. Cada grupo aponta uma linha do TM (`/bpe-lines`, com placa,
        prefixo, trechos e ICMS de cada trecho); cada item aponta o trecho da linha (`leg`) e informa contadores, passageiros,
        valor e a quantidade por tipo de passageiro (os tipos vêm da linha). Todas as linhas devem ter o mesmo modal e o mesmo
        CFOP. O `total` sai da soma dos itens; o TM não tem QR Code.
      required: [ variant, competence, groups ]
      properties:
        variant: { type: string, enum: [ tm ] }
        competence: { type: string, format: date }
        supply_indicator: { type: boolean, description: '`indFornecimento` (valor 1).' }
        groups:
          type: array
          minItems: 1
          maxItems: 99
          items:
            type: object
            required: [ line_id, items ]
            properties:
              line_id: { type: string, pattern: '^[A-Za-z0-9._/-]{1,60}$' }
              counter_id: { type: integer, minimum: 1, maximum: 990 }
              items:
                type: array
                minItems: 1
                maxItems: 990
                items:
                  type: object
                  required: [ leg, passengers, value, components ]
                  properties:
                    leg: { type: integer, minimum: 1, maximum: 990, description: Posição do trecho no cadastro da linha (1, 2, ...). }
                    trip_number: { type: integer, minimum: 1, maximum: 990 }
                    start_counter: { type: string, pattern: '^[0-9]{1,20}$' }
                    end_counter: { type: string, pattern: '^[0-9]{1,20}$' }
                    passengers: { type: string, pattern: '^[0-9]{1,6}$' }
                    value: { type: string, description: Decimal não negativo. }
                    components:
                      type: array
                      minItems: 1
                      maxItems: 20
                      items:
                        type: object
                        required: [ name, quantity ]
                        properties:
                          name: { type: string, minLength: 1, maxLength: 15, description: Tipo de passageiro da linha. }
                          quantity: { type: integer, minimum: 0, maximum: 99999 }
        additional_info: { type: string, maxLength: 5000 }
        authorized_xml:
          type: array
          maxItems: 10
          items: { type: string }
        contingency_reason: { type: string, minLength: 15, maxLength: 256 }

    BpeSubstitution:
      type: object
      required: [ original_key, type ]
      description: Grupo `infBPeSub`. No comum valem os tipos 1 a 3; o TA aceita também 4 a 7 e 9.
      properties:
        original_key: { type: string, minLength: 44, maxLength: 44, description: Chave do BP-e substituído. }
        type: { type: string, enum: [ '1', '2', '3', '4', '5', '6', '7', '9' ], description: '`tpSub`: 1 remarcação, 2 transferência, 3 transferência e remarcação, 4 erro de tarifa, 5 erro de tributação, 6 decisão judicial, 7 erro cadastral, 9 outros.' }

    BpeTaTax:
      type: object
      description: |
        IBS e CBS do TA (omitido só no vinculado a múltiplo). `class_trib` é um cClassTrib da tabela do IT 2025.002 RT v1.71 com `indBPeTA` (oito classificações:
        000001, 200050, 222001, 410001, 410003, 410004, 410026 e 410999); o CST sai da linha da tabela e os grupos exigidos ou
        vedados saem dos indicadores do CST e da classificação. As alíquotas de 2026 a 2028 (IBS) e de 2026 (CBS) são as da
        lei e o servidor as aplica; informá-las onde a lei já as fixa é 400, e omiti-las onde ainda não existem também.
        Base de cálculo = valor pago. `vTotDFe` = valor do bilhete (2026) ou valor do bilhete + IBS + CBS (2027 em diante).
      required: [ class_trib ]
      properties:
        class_trib: { type: string, pattern: '^[0-9]{6}$' }
        donation: { type: boolean, description: '`indDoacao`: a classificação exige, veda ou admite.' }
        ibs_uf_rate: { type: string, description: 'Alíquota em %, só a partir de 2029.' }
        ibs_mun_rate: { type: string, description: 'Alíquota em %, só a partir de 2029.' }
        cbs_rate: { type: string, description: 'Alíquota em %, só a partir de 2027.' }
        deferral:
          type: object
          description: Percentuais de diferimento (`pDif`); só com CST que exige diferimento (nenhuma classificação do TA na tabela v1.71).
          properties:
            ibs_uf: { type: string }
            ibs_mun: { type: string }
            cbs: { type: string }
        devolution:
          type: object
          description: Valores devolvidos (`vDevTrib`), abatidos do tributo.
          properties:
            ibs_uf: { type: string }
            ibs_mun: { type: string }
            cbs: { type: string }
        regular:
          type: object
          description: Tributação regular (`gTribRegular`); só nas classificações que a exigem (nenhuma do TA na tabela v1.71).
          required: [ cst, class_trib, ibs_uf_rate, ibs_mun_rate, cbs_rate ]
          properties:
            cst: { type: string, pattern: '^[0-9]{3}$' }
            class_trib: { type: string, pattern: '^[0-9]{6}$' }
            ibs_uf_rate: { type: string }
            ibs_mun_rate: { type: string }
            cbs_rate: { type: string }
        government:
          type: object
          description: Compra governamental (`ide/gCompraGov` e `gTribCompraGov`).
          required: [ entity, reducer, operation ]
          properties:
            entity: { type: string, enum: [ '1', '2', '3', '4', '5', '6' ], description: '`tpEnteGov`: 1 União, 2 Estados, 3 Distrito Federal, 4 Municípios, 5 consórcio público, 6 Comitê Gestor do IBS.' }
            reducer: { type: string, description: 'Redutor `pRedutor`, em %.' }
            operation: { type: string, enum: [ '1', '2', '3', '4' ], description: '`tpOperGov`; com 2 vai uma chave referenciada, com 3 uma ou mais, com 1 e 4 nenhuma.' }
            references:
              type: array
              maxItems: 99
              items: { type: string, pattern: '^[0-9]{6}[A-Z0-9]{12}[0-9]{26}$' }
        credit_reversal:
          type: object
          description: Estorno de crédito (`gEstornoCred`), exigido por classificações como a 410026 e vedado nas demais.
          required: [ ibs, cbs ]
          properties:
            ibs: { type: string }
            cbs: { type: string }
        simples:
          type: object
          description: Composição do IBS e da CBS do optante do Simples Nacional (`gTribSN`), alíquotas efetivas sobre o valor pago.
          properties:
            ibs_rate: { type: string }
            cbs_rate: { type: string }
        total_taxes: { type: string, description: '`vTotTrib`.' }
        fiscal_info: { type: string, minLength: 1, maxLength: 2000, description: '`infAdFisco`.' }
    purchase_type: { type: string, enum: [ normal, multiple, linked ], description: '`tpCompra`: normal (padrão), multiple (BP-e múltiplo) ou linked (vinculado a múltiplo).' }
    multiple_key: { type: string, minLength: 44, maxLength: 44, description: Só no `linked`; chave do BP-e múltiplo. }
    substitution: { $ref: '#/components/schemas/BpeSubstitution' }
    agency: { $ref: '#/components/schemas/BpeAgency' }

    BpeLineBody:
      type: object
      description: |
        Linha do BP-e: o que não muda de uma venda para outra. Uma linha serve a uma variante: no comum é o percurso (origem,
        destino, código e nome da linha, serviço, acomodação, prefixo e ICMS); no TA é o voo (companhia, número, aeroportos,
        serviço, acomodação e IBS/CBS); no TM é o grupo de viagem (placa, prefixo, trechos com o ICMS de cada um e os tipos de
        passageiro). Os municípios vêm da tabela do IBGE. A linha é recusada com as regras que a emissão aplicaria.
      required: [ name, variant ]
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        variant: { type: string, enum: [ normal, ta, tm ] }
        modal: { type: [ string, 'null' ], enum: [ rodoviario, aquaviario, ferroviario, null ], description: Comum e TM. }
        origin: { $ref: '#/components/schemas/BpeLinePlace' }
        destination: { $ref: '#/components/schemas/BpeLinePlace' }
        route_code: { type: [ string, 'null' ], pattern: '^[A-Za-z0-9._/-]{1,20}$' }
        route_name: { type: [ string, 'null' ], minLength: 2, maxLength: 100 }
        prefix: { type: [ string, 'null' ], pattern: '^[A-Za-z0-9._/-]{1,20}$' }
        trip_type: { type: [ string, 'null' ], enum: [ '00', '01', '02', '03', null ], description: 'Comum: 00 e 01; TA: 00 a 03.' }
        service_type: { type: [ string, 'null' ], description: 'Comum: 1 a 11; TA: 12 e 13.' }
        accommodation: { type: [ string, 'null' ], description: 'Comum: 1 a 5; TA: 6 e 7.' }
        icms:
          type: [ object, 'null' ]
          required: [ cst ]
          properties:
            cst: { type: string, enum: [ '00', '40', '41', '51', '90', sn ] }
            rate: { type: [ string, 'null' ], description: Obrigatória em 00 e 90. }
        carrier: { type: [ string, 'null' ], pattern: '^[A-Z0-9]{2,3}$' }
        flight_number: { type: [ string, 'null' ], pattern: '^[A-Za-z0-9._/-]{1,20}$' }
        from_airport: { type: [ string, 'null' ], pattern: '^[A-Z0-9]{3,4}$' }
        to_airport: { type: [ string, 'null' ], pattern: '^[A-Z0-9]{3,4}$' }
        tax: { $ref: '#/components/schemas/BpeTaTax' }
        cfop: { type: [ string, 'null' ], pattern: '^[123567][0-9]([0-9][1-9]|[1-9][0-9])$', description: Só no TM. }
        plate: { type: [ string, 'null' ] }
        origin_uf: { type: [ string, 'null' ], description: Só no TM. }
        dest_uf: { type: [ string, 'null' ], description: 'Só no TM; UF ou EX.' }
        legs:
          type: [ array, 'null' ]
          maxItems: 990
          items:
            type: object
            required: [ origin_ibge_code, icms ]
            properties:
              origin_ibge_code: { type: string, pattern: '^[0-9]{7}$' }
              dest_ibge_code: { type: [ string, 'null' ], pattern: '^[0-9]{7}$' }
              icms:
                type: object
                required: [ cst ]
                properties:
                  cst: { type: string, enum: [ '00', '40', '41', '51', '90', sn ] }
                  rate: { type: [ string, 'null' ] }
        passenger_types:
          type: [ array, 'null' ]
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 15 }
          description: Só no TM; tipos de passageiro (nome do componente de tarifa).

    BpeLinePlace:
      type: [ object, 'null' ]
      required: [ uf, ibge_code, city ]
      properties:
        uf: { type: string }
        ibge_code: { type: string, pattern: '^[0-9]{7}$' }
        city: { type: string, minLength: 2, maxLength: 60 }

    BpeLineItem:
      type: object
      description: Linha persistida.
      additionalProperties: true
      properties:
        pk: { type: string }
        sk: { type: string, description: Identificador da linha. }
        name: { type: string }
        variant: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
