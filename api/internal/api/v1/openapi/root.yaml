  - name: Organizations
    description: Cadastro das organizações emitentes e autorizados a baixar XML.
  - name: Fiscal Configs
    description: Configuração de série, numeração e ambiente por tipo de documento.
  - name: Certificates
    description: Certificados digitais A1 (PFX) usados na assinatura e no mTLS.
  - name: Members
    description: Membros da organização e convites.
  - name: Invitations
    description: Aceite/recusa de convites pelo destinatário (endereçado por token).
  - name: Products
    description: Catálogo de produtos e sua configuração fiscal por CFOP.
  - name: Services
    description: Catálogo de serviços (NFS-e) e seus defaults tributários.
  - name: Persons
    description: Cadastro de pessoas (destinatários, tomadores, transportadores).
  - name: Vehicles
    description: Frota usada em NF-e (transporte), MDF-e e CT-e OS.
  - name: NF-e
    description: Nota Fiscal Eletrônica (modelo 55).
  - name: NFC-e
    description: Nota Fiscal de Consumidor Eletrônica (modelo 65).
  - name: MDF-e
    description: Manifesto Eletrônico de Documentos Fiscais.
  - name: NFS-e
    description: Nota Fiscal de Serviço Eletrônica (padrão nacional e ABRASF).
  - name: Distributions
    description: Documentos destinados à organização, obtidos da SEFAZ/ADN.
  - name: Audit Logs
    description: Trilha de auditoria das mutações da organização.
  - name: External
    description: Consultas em sistemas externos (cadastro de contribuintes).
