openapi: 3.1.0

# Fonte única da documentação da API. É mantida à mão e vigiada pelo teste de
# cobertura em openapi_test.go: toda rota registrada no Fiber tem que aparecer
# aqui, senão o teste quebra. Ao adicionar/remover rota, edite este arquivo na
# mesma mudança.

info:
  title: CTech DFe API
  version: '1.0'
  summary: Emissão e consulta de documentos fiscais eletrônicos (NF-e, NFC-e, MDF-e, NFS-e).
  description: |
    API REST multi-tenant para emissão, consulta e gestão de documentos fiscais
    eletrônicos brasileiros, com comunicação direta com a SEFAZ (SOAP + mTLS) e
    com o Ambiente de Dados Nacional da NFS-e.

    ## Autenticação

    Todas as rotas — exceto `GET /v1.0/health-check` — exigem um JWT RS256
    emitido pelo ctech-account no header `Authorization: Bearer <token>`.

    ## Contexto de organização (multi-tenancy)

    Quase toda rota opera dentro de uma organização. A organização ativa é
    enviada no header `Dfe-Organization-Pk`, **nunca** como parâmetro de path.
    As exceções são as rotas sob `/organizations/{org_pk}`, cuja organização
    vem do path, `POST /organizations` e `GET /organizations`.

    ## Erros

    Todo erro é um RFC 7807 Problem Details (`application/problem+json`). Erros
    de validação de corpo (422) trazem `errors[]` com um item por campo
    reprovado, usando o caminho JSON do campo (`person.addresses[0].postal_code`).

    ## Emissão assíncrona

    `POST /nfes`, `/nfces`, `/mdfes` e `/nfses` gravam o documento com
    `status: pending` e despacham o processamento para o worker. O resultado da
    SEFAZ chega depois, por WebSocket (`GET /v1.0/ws`) ou por polling da rota de
    detalhe do documento.

    ## Paginação

    Listagens usam cursor opaco em base64. A resposta traz `next_cursor` /
    `previous_cursor`; repasse o valor em `?cursor=` para navegar. Nunca
    construa um cursor à mão.
