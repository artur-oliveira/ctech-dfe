name: go-dfe

# Called by deploy.yml. go-dfe is a library, not a deployable service, and
# go-dfe-egress (the Lambda that runs it in sa-east-1) is deployed by the CDK
# stack — so this only builds and tests both. deploy.yml gates the CDK, worker
# and api jobs on this one (see its `needs`), so a go-dfe regression blocks them.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go-dfe/go.mod
          # go-dfe has no go.sum of its own: in workspace mode (go.work at
          # the repo root) its checksums live in the shared go.work.sum
          # instead — see go-dfe/CLAUDE.md's "Known Constraints".
          cache-dependency-path: |
            go.work.sum
            go-dfe-egress/go.sum

      - name: Build (arm64, CGO disabled — matches the worker/api Lambda target)
        working-directory: go-dfe
        run: CGO_ENABLED=0 GOARCH=arm64 go build -o /dev/null ./...

      - name: Run tests
        working-directory: go-dfe
        run: go test ./... -race -count=1

      - name: Build egress (arm64, CGO disabled)
        working-directory: go-dfe-egress
        run: CGO_ENABLED=0 GOARCH=arm64 go build -o /dev/null ./...

      - name: Test egress
        working-directory: go-dfe-egress
        run: go test ./... -race -count=1
