name: Frontend

# Called by deploy.yml, which owns the trigger, the path filter and the
# CDK → py-dfe → worker → API → Frontend ordering. Never triggered on push.
#
# Everything that used to live here — environment resolution, the two-pass
# s3 sync, publish-routes.sh, the CloudFront invalidation — is now in the
# reusable workflow. What stays is what is actually specific to this service:
# the NEXT_PUBLIC_* values per environment.
#
# The CSP connect-src is derived from those values by the reusable workflow, so
# adding an origin here is all it takes for the policy to allow it.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    uses: artur-oliveira/ctech-cdk/.github/workflows/frontend-cloudflare.yml@main
    secrets: inherit
    with:
      service: ctech-dfe
      # NEXT_PUBLIC_API_URL is the dfe-api host, not the app host: nothing is
      # proxied at the edge any more, so the browser calls the API directly and
      # CORS applies. The API already ships AllowCredentials with
      # CORS_ALLOWED_ORIGINS="$SERVICE_AUDIENCE" (the app URL), so no
      # infrastructure change is needed for that.
      #
      # NEXT_PUBLIC_WS_URL is now set explicitly. It used to be left unset so it
      # would fall back to the app origin and ride the CloudFront forward; with
      # that gone, the fallback would yield the right host but the wrong scheme
      # for the CSP, which is built from these literals.
      build-env-dev: |
        NEXT_PUBLIC_API_URL=https://dfe-api-dev.aoctech.app
        NEXT_PUBLIC_WS_URL=wss://dfe-api-dev.aoctech.app
        NEXT_PUBLIC_CTECH_URL=https://accounts-dev-api.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_URL=https://accounts-dev.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_ID=dfe
      build-env-stage: |
        NEXT_PUBLIC_API_URL=https://dfe-api-stage.aoctech.app
        NEXT_PUBLIC_WS_URL=wss://dfe-api-stage.aoctech.app
        NEXT_PUBLIC_CTECH_URL=https://accounts-stage-api.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_URL=https://accounts-stage.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_ID=dfe
      build-env-prod: |
        NEXT_PUBLIC_API_URL=https://dfe-api.aoctech.app
        NEXT_PUBLIC_WS_URL=wss://dfe-api.aoctech.app
        NEXT_PUBLIC_CTECH_URL=https://accounts-api.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_URL=https://accounts.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_ID=dfe
      # CEP lookup, called straight from the browser. Not a NEXT_PUBLIC_* value,
      # so it cannot be derived.
      extra-connect-src: https://viacep.com.br
