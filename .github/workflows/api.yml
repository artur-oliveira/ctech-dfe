name: API

# Called by deploy.yml, which owns the trigger, the path filter and the
# CDK → py-dfe → worker → API → Frontend ordering. Never triggered on push.
on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            go.work.sum

      - name: Run tests
        working-directory: api
        run: go test ./... -race -count=1

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-24.04-arm
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            go.work.sum

      - name: Resolve environment
        id: env
        run: |
          case "${{ github.ref_name }}" in
            main)    echo "name=prod"  >> "$GITHUB_OUTPUT" ;;
            staging) echo "name=stage" >> "$GITHUB_OUTPUT" ;;
            *)       echo "name=dev"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::868899309401:role/ctech-dfe-gha-api
          aws-region: us-east-1

      - name: Build binary
        working-directory: api
        run: |
          SHORT_SHA="${{ github.sha }}"
          # Format: YYMMDDHHMM:<7-char commit> — consumed by the app via APP_VERSION
          VERSION="$(date -u '+%y%m%d%H%M'):${SHORT_SHA:0:7}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          # Filesystem-safe variant for the S3 artifact name (no ':')
          echo "ARTIFACT_VERSION=$(date -u '+%y%m%d%H%M')-${SHORT_SHA:0:7}" >> "$GITHUB_ENV"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -ldflags="-s -w" -o dist/app ./cmd/server
          # Ship the version as an env file inside the artifact; start.sh sources it
          # so the running app exposes it via APP_VERSION (health check + nota verProc).
          echo "APP_VERSION=${VERSION}" > dist/release.env

      - name: Package application
        working-directory: api
        run: |
          ARCHIVE="api-${ARTIFACT_VERSION}.zip"
          zip -j "${ARCHIVE}" dist/app dist/release.env
          echo "ARCHIVE_FILE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Read deployment config from SSM
        run: |
          ENVIRONMENT="${{ steps.env.outputs.name }}"
          BUCKET=$(aws ssm get-parameter --name "/ctech/$ENVIRONMENT/s3/deployments-bucket" --query Parameter.Value --output text 2>/dev/null || echo "${ENVIRONMENT}-ctech-deployments")
          ASG_NAME="${ENVIRONMENT}-ctech-dfe"
          echo "DEPLOYMENTS_BUCKET=$BUCKET" >> $GITHUB_ENV
          echo "ASG_NAME=$ASG_NAME" >> $GITHUB_ENV

      - name: Upload to S3
        working-directory: api
        run: |
          # Versioned artifact (expires after 30 days via bucket lifecycle)
          aws s3 cp "$ARCHIVE_FILE" "s3://${DEPLOYMENTS_BUCKET}/ctech-dfe/api/${ARCHIVE_FILE}"

          # Overwrite current.zip so new ASG instances bootstrap this version
          aws s3 cp "$ARCHIVE_FILE" "s3://${DEPLOYMENTS_BUCKET}/ctech-dfe/api/current.zip"

      - name: Rolling deploy via SSM
        uses: artur-oliveira/ctech-cdk/.github/actions/deploy-backend@main
        with:
          asg-name: ${{ env.ASG_NAME }}
          artifact-key: ctech-dfe/api/current.zip
