name: CI

# Pull requests only. Until this file existed, the DF-e had no check on a pull
# request at all — the Go and UI tests ran only inside deploy.yml, after the
# merge (#117 merged with "no checks reported"). A check that can only fail
# after main has moved is a check that reports a broken main.
#
# The same commands the deploy pipelines run (api.yml, godfe.yml, worker.yml,
# ctech-cdk's frontend workflow), so a green PR means a green deploy gate.
# Infrastructure keeps its own PR check in infra.yml.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-26.04-arm
    strategy:
      # Every module reports, so one red module does not hide another.
      fail-fast: false
      matrix:
        module: [api, worker, go-dfe, go-dfe-egress]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          # Workspace mode (go.work at the root): checksums live in the shared
          # go.work.sum, and go-dfe has no go.sum of its own.
          cache-dependency-path: |
            go.work.sum
            ${{ matrix.module }}/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build (arm64, CGO disabled — the Lambda and EC2 target)
        run: CGO_ENABLED=0 GOARCH=arm64 go build -o /dev/null ./...

      - name: Test
        run: go test ./... -race -count=1

      # Built against the newest x/tools: staticcheck's pinned one cannot read a
      # newer Go patch's export data (same workaround as ctech-billing).
      - name: Build staticcheck
        run: |
          dir=$(mktemp -d)
          (cd "$dir" && go mod init staticcheck >/dev/null 2>&1 \
            && go get honnef.co/go/tools/cmd/staticcheck@latest golang.org/x/tools@latest \
            && go build -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck)

      - name: Staticcheck
        run: $RUNNER_TEMP/staticcheck ./...

      - name: Staticcheck (integration tag)
        if: matrix.module == 'api'
        run: $RUNNER_TEMP/staticcheck -tags integration ./...

      # Reports only vulnerabilities on a reachable call path.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Vulnerability scan (integration tag)
        if: matrix.module == 'api'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -tags integration ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ${{ matrix.module }}

  ui:
    name: UI Lint, Types & Tests
    runs-on: ubuntu-26.04-arm
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `npm ci`, never `npm install`: the lockfile exactly, or a failure.
      - run: npm ci

      - name: Lint
        run: npm run lint

      # shortcut: reports without failing; production deps already carry high
      # advisories (ui and cdk), so a hard gate would turn every PR red. Drop
      # continue-on-error once they are fixed.
      - name: Dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      # Judged by vitest's exit code, which counts unhandled errors and
      # rejections as failures even when every test passes.
      - name: Tests
        run: npm test

      # Per-route first-load JS against ui/bundle-budget.json, measured on the
      # same plain `next build` export the deploy publishes.
      - name: Build static export
        run: npm run build

      - name: Bundle budget
        run: npm run bundle:check

  cdk:
    name: CDK Tests
    runs-on: ubuntu-26.04-arm
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - run: npm ci

      # shortcut: reports without failing; production deps already carry high
      # advisories (ui and cdk), so a hard gate would turn every PR red. Drop
      # continue-on-error once they are fixed.
      - name: Dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Jest
        run: npx jest

      - name: Type check
        run: npx tsc --noEmit
