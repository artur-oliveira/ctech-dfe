# Included inside http {} by the shared setup-nginx.sh.
#
# Loaded after the shared gzip block, so the gzip directives here override it:
# DF-e serves NF-e XML, which the shared list does not compress.
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types application/json application/javascript text/plain text/css text/xml application/xml application/rss+xml;

# Per-tenant zones. The header key is empty for unauthenticated traffic, which
# nginx ignores (no limit applied) — the shared per-IP zone still covers it.
limit_req_zone $http_dfe_organization_pk  zone=req_by_tenant:20m rate=500r/s;
limit_conn_zone $http_dfe_organization_pk zone=conn_by_tenant:20m;
